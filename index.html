  // ---------- Superset builder modal ----------
  // Triggered from an exercise's "+ Superset" button. Lets you search and add
  // one or more exercises that join the workout already grouped with the
  // exercise you started from — replaces the old "select checkboxes, then
  // Link as Superset" flow. Works to grow an existing superset into a
  // tri-set/giant-set too, since it just reuses the origin item's blockId.
  function openSupersetBuilder(originItemLocalId) {
    supersetBuilder = { originItemLocalId: originItemLocalId, pending: [], backdrop: null };
    supersetBuilder.backdrop = showModal('Add to Superset', '<div id="sbBodyWrap"></div>', true);
    renderSupersetBuilder();
  }

  function closeSupersetBuilder() {
    if (supersetBuilder && supersetBuilder.backdrop) closeModal(supersetBuilder.backdrop);
    supersetBuilder = null;
  }

  function renderSupersetBuilder() {
    if (!supersetBuilder) return;
    var wrap = supersetBuilder.backdrop.querySelector('#sbBodyWrap');
    if (!wrap) return;
    var origin = session.items.find(function (i) { return i.localId === supersetBuilder.originItemLocalId; });
    var pendingHtml = supersetBuilder.pending.map(function (p, idx) {
      return '<div class="exercise-row"><span class="name">' + escapeHtml(p.name) + '</span>' +
        '<button class="remove-x" data-sb-remove="' + idx + '">✕</button></div>';
    }).join('');

    wrap.innerHTML =
      '<p class="muted" style="margin-top:0;">Grouping with <b>' + escapeHtml(origin ? origin.name : '') + '</b>. Search for exercises to add — each one joins this workout as part of the superset. Add as many as you want.</p>' +
      (pendingHtml ? '<div style="margin-bottom:10px;">' + pendingHtml + '</div>' : '') +
      '<div class="field"><input type="text" id="sbSearch" placeholder="Search exercises to add..." autocomplete="off"></div>' +
      '<div id="sbResults" class="search-results"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn secondary" id="sbCancelBtn">Cancel</button>' +
        '<button class="btn" id="sbConfirmBtn"' + (supersetBuilder.pending.length ? '' : ' disabled') + '>Add exercises as superset</button>' +
      '</div>';

    wrap.querySelectorAll('[data-sb-remove]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        supersetBuilder.pending.splice(Number(btn.dataset.sbRemove), 1);
        renderSupersetBuilder();
      });
    });
    wrap.querySelector('#sbSearch').addEventListener('input', function () {
      var q = this.value.trim().toLowerCase();
      var results = wrap.querySelector('#sbResults');
      if (!q) { results.innerHTML = ''; return; }
      var matches = exercisesCache.filter(function (e) { return e.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 20);
      results.innerHTML = matches.length
        ? matches.map(function (e) {
            return '<div class="exercise-row" data-sb-pick="' + e.id + '"><span class="name">' + escapeHtml(e.name) + '</span>' + equipmentChipHtml(e.equipment) + '</div>';
          }).join('')
        : '<div class="muted" style="padding:8px 0;">No matches</div>';
      results.querySelectorAll('[data-sb-pick]').forEach(function (row) {
        row.addEventListener('click', function () {
          var ex = exercisesCache.find(function (e) { return e.id === row.dataset.sbPick; });
          if (!ex) return;
          supersetBuilder.pending.push({ exerciseId: ex.id, name: ex.name, category: ex.category, equipment: ex.equipment || '', unilateral: !!ex.unilateral });
          renderSupersetBuilder();
        });
      });
    });
    wrap.querySelector('#sbCancelBtn').addEventListener('click', closeSupersetBuilder);
    wrap.querySelector('#sbConfirmBtn').addEventListener('click', function () {
      if (!supersetBuilder.pending.length) return;
      var originNow = session.items.find(function (i) { return i.localId === supersetBuilder.originItemLocalId; });
      if (!originNow) { closeSupersetBuilder(); return; }
      var sharedBlockId = originNow.blockId; // reuses the origin's current group, so this also grows an existing superset into a tri-set/giant-set
      // New exercises get one blank set per existing round, so every round has a set for each exercise.
      var roundCount = Math.max(1, Math.max.apply(null, session.items
        .filter(function (i) { return i.blockId === sharedBlockId; })
        .map(function (i) { return setsForItem(i.localId).length; }).concat([0])));
      supersetBuilder.pending.forEach(function (p) {
        var localId = uid();
        var member = { localId: localId, exerciseId: p.exerciseId, name: p.name, category: p.category, equipment: p.equipment, blockId: sharedBlockId };
        session.items.push(member);
        if (p.unilateral) itemMode[localId] = 'both';
        for (var r = 0; r < roundCount; r++) session.sets.push(newSetFor(member, null));
      });
      closeSupersetBuilder();
      renderSession();
      showToast('Added to superset');
    });
  }

  function groupByBlock(items) {
    var order = [];
    var map = {};
    items.forEach(function (item) {
      if (!map[item.blockId]) { map[item.blockId] = []; order.push(item.blockId); }
      map[item.blockId].push(item);
    });
    return order.map(function (blockId) { return { blockId: blockId, items: map[blockId] }; });
  }

  // ---------- Advanced set logging: tempo / failure / drop segments / unilateral helpers ----------

  function exerciseDefaultTempo(exerciseId) {
    var ex = exercisesCache.find(function (e) { return e.id === exerciseId; });
    return (ex && ex.defaultTempo) || null;
  }
  function tempoLabel(t) {
    if (!t) return '';
    return [t.eccentric, t.bottomPause, t.concentric, t.topPause].map(function (n) { return (n == null || n === '') ? '0' : n; }).join('-');
  }
  // ---------- Set model helpers ----------
  // A set is "done" when its checkbox is checked — that (and only that) is what
  // gets saved. Adding the next set checks off the previous one automatically.

  function cloneJson(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }
  function itemById(localId) { return session.items.find(function (i) { return i.localId === localId; }); }
  function setById(localId) { return session.sets.find(function (s) { return s.localId === localId; }); }
  function setsForItem(itemLocalId) { return session.sets.filter(function (s) { return s.itemLocalId === itemLocalId; }); }
  function isBodyweightItem(item) { return !!item && item.equipment === 'Bodyweight'; }
  function hasNum(v) { return v != null && v !== '' && !isNaN(v); }

  // Real numbers in place (a set can't be checked off, or saved, without them).
  // For an independent left/right set, one complete side is enough.
  function isSetComplete(s) {
    if (s.mode === 'independent') {
      return (hasNum(s.weight) && hasNum(s.reps)) || (!!s.right && hasNum(s.right.weight) && hasNum(s.right.reps));
    }
    return hasNum(s.weight) && hasNum(s.reps);
  }

  // A fresh, unchecked set for an exercise. When there's a previous set its
  // numbers (and tempo) are copied forward as a grey "prefilled" starting point.
  function newSetFor(item, prev) {
    var mode = itemMode[item.localId] || 'bilateral';
    var s = {
      localId: uid(), itemLocalId: item.localId, mode: mode,
      weight: null, reps: null, right: null,
      toFailure: false, tempo: prev ? cloneJson(prev.tempo) : null, dropSegments: [],
      sign: prev && prev.sign === -1 ? -1 : 1,
      done: false, prefilled: false
    };
    var prevHasNumbers = prev && (hasNum(prev.weight) || hasNum(prev.reps) ||
      (prev.right && (hasNum(prev.right.weight) || hasNum(prev.right.reps))));
    if (prevHasNumbers) {
      s.weight = prev.weight; s.reps = prev.reps; s.prefilled = true;
      if (mode === 'independent') {
        s.right = prev.right ? { weight: prev.right.weight, reps: prev.right.reps } : { weight: prev.weight, reps: prev.reps };
      }
    } else if (mode === 'independent') {
      s.right = { weight: null, reps: null };
    }
    return s;
  }

  function focusSetWeight(setLocalId) {
    var w = $('w-' + setLocalId);
    if (w) w.focus();
  }

  // "+ Add Set" on a single exercise: checks off the previous set (if it has
  // numbers) and adds a new one copied from it.
  function addSet(itemLocalId) {
    var item = itemById(itemLocalId);
    if (!item) return;
    var sets = setsForItem(itemLocalId);
    var prev = sets[sets.length - 1] || null;
    if (prev && !prev.done) {
      if (!isSetComplete(prev)) { showToast('Enter weight and reps for the current set first', true); return; }
      prev.done = true; prev.prefilled = false;
    }
    var s = newSetFor(item, prev);
    session.sets.push(s);
    renderSession();
    focusSetWeight(s.localId);
  }

  // "+ Add Superset": copies the whole superset box down — one new set for every
  // exercise in the group — and checks off the previous round.
  function addRound(blockId) {
    var block = groupByBlock(session.items).filter(function (b) { return b.blockId === blockId; })[0];
    if (!block) return;
    var lasts = block.items.map(function (i) { var ss = setsForItem(i.localId); return ss[ss.length - 1] || null; });
    var existing = lasts.filter(Boolean);
    if (existing.length && !existing.some(function (s) { return s.done || isSetComplete(s); })) {
      showToast('Enter weight and reps for the current set first', true); return;
    }
    existing.forEach(function (s) { if (!s.done && isSetComplete(s)) { s.done = true; s.prefilled = false; } });
    var first = null;
    block.items.forEach(function (item, idx) {
      var ns = newSetFor(item, lasts[idx]);
      session.sets.push(ns);
      if (!first) first = ns;
    });
    renderSession();
    if (first) focusSetWeight(first.localId);
  }

  function deleteSets(ids) {
    session.sets = session.sets.filter(function (s) { return ids.indexOf(s.localId) === -1; });
    ids.forEach(function (id) { delete expandedSetPanels[id]; });
    renderSession();
  }

  // Bodyweight +/-: added weight vs. assisted. Weight is stored signed.
  function toggleSetSign(setLocalId) {
    var s = setById(setLocalId);
    if (!s) return;
    var newSign = s.sign === -1 ? 1 : -1;
    s.sign = newSign;
    if (hasNum(s.weight)) s.weight = Math.abs(s.weight) * newSign;
    if (s.right && hasNum(s.right.weight)) s.right.weight = Math.abs(s.right.weight) * newSign;
    renderSession();
  }

  // Switching an exercise's unilateral mode converts its sets that aren't checked
  // off yet (and is what new sets use); checked-off sets keep how they were logged.
  // Collapsing left/right values that differ asks first — never silently drops one side.
  function convertSetMode(s, mode) {
    if (s.mode === mode) return;
    if (mode === 'independent') {
      s.right = (hasNum(s.weight) || hasNum(s.reps)) ? { weight: s.weight, reps: s.reps } : { weight: null, reps: null };
    } else {
      s.right = null;
    }
    s.mode = mode;
  }
  function changeItemMode(itemLocalId, newMode) {
    var pending = setsForItem(itemLocalId).filter(function (s) { return !s.done; });
    if (newMode !== 'independent') {
      var mismatch = pending.some(function (s) {
        return s.mode === 'independent' && s.right && hasNum(s.right.weight) && (s.right.weight !== s.weight || s.right.reps !== s.reps);
      });
      if (mismatch && !confirm("Left and right values differ on some sets. Switching keeps the LEFT values and discards the right. Continue?")) {
        renderSession();
        return;
      }
    }
    itemMode[itemLocalId] = newMode;
    pending.forEach(function (s) { convertSetMode(s, newMode); });
    renderSession();
  }

  // ---------- Advanced set logging: tempo / failure / drop segments / unilateral helpers ----------

  function stateForKey(key) {
    if (key.indexOf('set:') === 0) return setById(key.slice(4));
    return null;
  }
  // The exercise default tempo for whatever a key points at — used so that
  // editing just ONE tempo field seeds the other three from the default
  // instead of zeroing them out.
  function defaultTempoForKey(key) {
    var s = stateForKey(key);
    var item = s && itemById(s.itemLocalId);
    return item ? exerciseDefaultTempo(item.exerciseId) : null;
  }

  function renderAdvancedPanel(key, state, defaultTempo, showAddDrop) {
    var labels = ['Ecc', 'Bottom', 'Con', 'Top'];
    var fields = ['eccentric', 'bottomPause', 'concentric', 'topPause'];
    return '<div class="advanced-panel">' +
      '<label class="field-row"><input type="checkbox" data-action="togglefailure" data-key="' + key + '"' + (state.toFailure ? ' checked' : '') + '> To Failure</label>' +
      '<div class="tempo-label">Tempo (Ecc-Bottom-Con-Top)' + (defaultTempo ? ' — default ' + escapeHtml(tempoLabel(defaultTempo)) : '') + '</div>' +
      '<div class="tempo-grid">' +
        fields.map(function (field, i) {
          var v = state.tempo ? state.tempo[field] : null;
          var ph = defaultTempo && defaultTempo[field] != null ? String(defaultTempo[field]) : '0';
          return '<div class="tempo-field"><label>' + labels[i] + '</label>' +
            '<input type="number" inputmode="numeric" placeholder="' + escapeHtml(ph) + '" data-action="tempofield" data-key="' + key + '" data-field="' + field + '" value="' + (v == null ? '' : escapeHtml(v)) + '"></div>';
        }).join('') +
      '</div>' +
      (showAddDrop ? '<button type="button" class="add-drop-btn" data-action="adddrop" data-key="' + key + '">+ Add Drop</button>' : '') +
    '</div>';
  }

  function renderDropRows(key, dropSegments) {
    return (dropSegments || []).map(function (seg, idx) {
      return '<div class="set-table-row sub">' +
        '<span class="cell-exercise">↳ Drop ' + (idx + 1) + '</span>' +
        '<input type="number" inputmode="decimal" class="cell-num" placeholder="lbs" data-action="dropweight" data-key="' + key + '" data-idx="' + idx + '" value="' + (seg.weight == null ? '' : escapeHtml(seg.weight)) + '">' +
        '<input type="number" inputmode="numeric" class="cell-num" placeholder="reps" data-action="dropreps" data-key="' + key + '" data-idx="' + idx + '" value="' + (seg.reps == null ? '' : escapeHtml(seg.reps)) + '">' +
        '<button class="del" data-action="deldrop" data-key="' + key + '" data-idx="' + idx + '">✕</button>' +
      '</div>';
    }).join('');
  }

  function numCell(setId, kind, side, value, cls, placeholder, id) {
    return '<input type="number" inputmode="' + (kind === 'weight' ? 'decimal' : 'numeric') + '"' +
      (id ? ' id="' + id + '"' : '') +
      ' class="cell-num' + cls + '" placeholder="' + placeholder + '"' +
      ' data-action="' + (kind === 'weight' ? 'editweight' : 'editreps') + '" data-setid="' + setId + '"' +
      (side ? ' data-side="' + side + '"' : '') +
      ' value="' + (value == null ? '' : escapeHtml(value)) + '">';
  }

  function signButtonHtml(s) {
    var neg = s.sign === -1;
    return '<button type="button" class="sign-toggle ' + (neg ? 'neg' : 'pos') + '" data-action="togglesign" data-setid="' + s.localId + '" title="' + (neg ? 'Assisted (subtract)' : 'Added weight') + '">' + (neg ? '−' : '+') + '</button>';
  }

  // One set: its row (weight, reps, checkbox), the right-hand row for independent
  // left/right, any drop segments, and a collapsible failure/tempo/drop panel.
  function renderSetUnit(s, item) {
    var key = 'set:' + s.localId;
    var isBW = isBodyweightItem(item);
    var defaultTempo = exerciseDefaultTempo(item.exerciseId);
    var effTempo = s.tempo || defaultTempo;
    var badgesHtml = (s.toFailure || effTempo)
      ? '<span class="set-badges">' +
          (s.toFailure ? '<span class="set-badge failure">Failure</span>' : '') +
          (effTempo ? '<span class="set-badge tempo">' + escapeHtml(tempoLabel(effTempo)) + '</span>' : '') +
        '</span>'
      : '';
    function shown(v) { return v == null ? null : (isBW ? Math.abs(v) : v); }
    var independent = s.mode === 'independent';
    var pref = (s.prefilled && !s.done) ? ' prefilled' : '';
    var repsPh = s.mode === 'both' ? 'each' : 'reps';
    var label = (item.name || '') + (s.mode === 'both' ? ' (per side)' : '');

    var weightL = numCell(s.localId, 'weight', independent ? 'left' : '', shown(s.weight), (hasNum(s.weight) ? '' : ' needs-weight') + pref, 'lbs', 'w-' + s.localId);
    if (isBW) weightL = '<span class="weight-with-sign">' + signButtonHtml(s) + weightL + '</span>';
    var repsL = numCell(s.localId, 'reps', independent ? 'left' : '', s.reps, pref, repsPh);
    var check = '<input type="checkbox" class="set-check" data-action="toggledone" data-setid="' + s.localId + '"' + (s.done ? ' checked' : '') + ' aria-label="Set done">';

    var html = '<div class="set-table-row' + (s.done ? ' done' : '') + '" data-setrow="' + s.localId + '">' +
      '<span class="cell-exercise">' + escapeHtml(label) + badgesHtml + '</span>' + weightL + repsL + check + '</div>';

    if (independent) {
      var r = s.right || { weight: null, reps: null };
      html += '<div class="set-table-row sub"><span class="cell-exercise">↳ R</span>' +
        numCell(s.localId, 'weight', 'right', shown(r.weight), (hasNum(r.weight) ? '' : ' needs-weight') + pref, 'lbs') +
        numCell(s.localId, 'reps', 'right', r.reps, pref, 'reps') + '<span></span></div>';
    }
    html += renderDropRows(key, s.dropSegments);

    var open = !!expandedSetPanels[s.localId];
    html += '<button type="button" class="advanced-toggle" data-action="expandset" data-setid="' + s.localId + '">' +
      (open ? '⚙ Hide Failure / Tempo' : '⚙ Failure / Tempo' + (independent ? '' : ' / Drop')) + '</button>';
    if (open) html += renderAdvancedPanel(key, s, defaultTempo, !independent);
    return html;
  }

  // Swipe a set left to reveal its Delete button (ids = every set the swipe removes).
  function swipeWrap(ids, inner) {
    return '<div class="set-swipe">' +
      '<button type="button" class="set-swipe-action" data-action="delsets" data-setids="' + ids.join(',') + '">Delete set</button>' +
      '<div class="set-swipe-content">' + inner + '</div>' +
    '</div>';
  }

  function tableHeadHtml() {
    return '<div class="set-table-row head"><span>Exercise</span><span>Weight (lbs)</span><span>Reps</span><span>✓</span></div>';
  }

  function modeSelectHtml(item) {
    var mode = itemMode[item.localId] || 'bilateral';
    return '<select class="mode-select" data-item="' + item.localId + '" title="Unilateral logging">' +
      '<option value="bilateral"' + (mode === 'bilateral' ? ' selected' : '') + '>Bilateral</option>' +
      '<option value="both"' + (mode === 'both' ? ' selected' : '') + '>Per Side (Same)</option>' +
      '<option value="independent"' + (mode === 'independent' ? ' selected' : '') + '>Per Side (L/R)</option>' +
    '</select>';
  }

  function renderSingleBlock(block) {
    var item = block.items[0];
    var head = '<div class="block-card-head"><div class="titles">' +
      '<span class="name">' + escapeHtml(item.name) + '</span>' + equipmentChipHtml(item.equipment) +
      modeSelectHtml(item) +
      '<button type="button" class="btn-sm" data-action="opensuperset" data-local="' + item.localId + '">+ Superset</button>' +
      '<button class="remove-x" data-action="remove" data-local="' + item.localId + '">✕</button>' +
    '</div></div>';
    var rows = setsForItem(item.localId).map(function (s) {
      return swipeWrap([s.localId], renderSetUnit(s, item));
    }).join('');
    return head + '<div class="set-table">' + tableHeadHtml() + rows +
      '<button type="button" class="add-set-row-btn" data-action="addset" data-item="' + item.localId + '">+ Add Set</button>' +
    '</div>';
  }

  // One round of a superset = one set for each exercise in the group, boxed together.
  function renderRound(block, k) {
    var ids = [];
    var rows = block.items.map(function (item) {
      var s = setsForItem(item.localId)[k];
      if (!s) return '';
      ids.push(s.localId);
      return renderSetUnit(s, item);
    }).join('');
    var inner = '<div class="superset-block"><div class="superset-label">Set ' + (k + 1) + '</div>' +
      '<div class="set-table">' + (k === 0 ? tableHeadHtml() : '') + rows + '</div></div>';
    return swipeWrap(ids, inner);
  }

  function supersetLabel(n) { return n === 2 ? 'Superset' : (n === 3 ? 'Tri-Set' : 'Giant Set'); }

  function renderSupersetGroup(block) {
    var rounds = Math.max.apply(null, block.items.map(function (i) { return setsForItem(i.localId).length; }).concat([0]));
    var head = '<div class="superset-head">' +
      '<div class="superset-label-row"><div class="superset-label">🔗 ' + supersetLabel(block.items.length) + '</div>' +
      '<button type="button" class="unlink-btn" data-action="unlink" data-block="' + block.blockId + '">Unlink</button></div>' +
      block.items.map(function (item) {
        return '<div class="ss-item"><span class="name">' + escapeHtml(item.name) + '</span>' + modeSelectHtml(item) +
          '<button class="remove-x" data-action="remove" data-local="' + item.localId + '">✕</button></div>';
      }).join('') +
    '</div>';
    var roundsHtml = '';
    for (var k = 0; k < rounds; k++) roundsHtml += renderRound(block, k);
    var actions = '<div class="superset-actions">' +
      '<button type="button" class="add-set-row-btn" data-action="opensuperset" data-local="' + block.items[0].localId + '">+ Add Exercise</button>' +
      '<button type="button" class="add-set-row-btn" data-action="addround" data-block="' + block.blockId + '">+ Add Superset</button>' +
    '</div>';
    return '<div class="superset-group">' + head + roundsHtml + actions + '</div>';
  }

  function unlinkBlock(blockId) {
    session.items.forEach(function (item) { if (item.blockId === blockId) item.blockId = uid(); });
    renderSession();
    showToast('Superset unlinked');
  }

  function renderSession() {
    var el = $('sessionExerciseList');

    if (!session.items.length) {
      el.innerHTML = '<div class="empty-state">Search below to add exercises to this workout.</div>';
      return;
    }

    el.innerHTML = groupByBlock(session.items).map(function (block) {
      return block.items.length > 1
        ? renderSupersetGroup(block)
        : '<div class="block-card">' + renderSingleBlock(block) + '</div>';
    }).join('');

    el.querySelectorAll('[data-action]').forEach(function (node) {
      node.addEventListener('click', function () {
        var action = node.dataset.action;
        var localId = node.dataset.local;
        if (action === 'remove') removeExerciseFromSession(localId);
        else if (action === 'addset') addSet(node.dataset.item);
        else if (action === 'addround') addRound(node.dataset.block);
        else if (action === 'delsets') deleteSets(node.dataset.setids.split(','));
        else if (action === 'togglesign') toggleSetSign(node.dataset.setid);
        else if (action === 'unlink') unlinkBlock(node.dataset.block);
        else if (action === 'opensuperset') openSupersetBuilder(localId);
        else if (action === 'expandset') {
          expandedSetPanels[node.dataset.setid] = !expandedSetPanels[node.dataset.setid];
          renderSession();
        }
        else if (action === 'adddrop') {
          var st = stateForKey(node.dataset.key);
          if (st) { if (!st.dropSegments) st.dropSegments = []; st.dropSegments.push({ weight: null, reps: null }); renderSession(); }
        } else if (action === 'deldrop') {
          var st2 = stateForKey(node.dataset.key);
          if (st2 && st2.dropSegments) { st2.dropSegments.splice(Number(node.dataset.idx), 1); renderSession(); }
        }
      });
    });
    el.querySelectorAll('select.mode-select').forEach(function (sel) {
      sel.addEventListener('change', function () { changeItemMode(sel.dataset.item, sel.value); });
    });
    // The checkbox is what marks a set as done (and therefore saved).
    el.querySelectorAll('input[data-action="toggledone"]').forEach(function (input) {
      input.addEventListener('change', function () {
        var s = setById(input.dataset.setid);
        if (!s) return;
        if (input.checked && !isSetComplete(s)) {
          input.checked = false;
          showToast('Enter weight and reps first', true);
          return;
        }
        s.done = input.checked;
        if (s.done) s.prefilled = false;
        renderSession();
      });
    });
    el.querySelectorAll('input[data-action="togglefailure"]').forEach(function (input) {
      input.addEventListener('change', function () {
        var st = stateForKey(input.dataset.key);
        if (st) { st.toFailure = input.checked; renderSession(); }
      });
    });
    // Tempo / drop fields mutate state directly on 'input' (no re-render) so typing doesn't lose focus;
    // an all-blank tempo collapses back to null (inherit the exercise default, if any).
    el.querySelectorAll('input[data-action="tempofield"]').forEach(function (input) {
      input.addEventListener('input', function () {
        var st = stateForKey(input.dataset.key);
        if (!st) return;
        if (!st.tempo) {
          var dt = defaultTempoForKey(input.dataset.key) || {};
          st.tempo = {
            eccentric: dt.eccentric != null ? dt.eccentric : null,
            bottomPause: dt.bottomPause != null ? dt.bottomPause : null,
            concentric: dt.concentric != null ? dt.concentric : null,
            topPause: dt.topPause != null ? dt.topPause : null
          };
        }
        var v = input.value === '' ? null : Number(input.value);
        st.tempo[input.dataset.field] = isNaN(v) ? null : v;
        var t = st.tempo;
        if (t.eccentric == null && t.bottomPause == null && t.concentric == null && t.topPause == null) st.tempo = null;
      });
    });
    el.querySelectorAll('input[data-action="dropweight"]').forEach(function (input) {
      input.addEventListener('input', function () {
        var st = stateForKey(input.dataset.key);
        var seg = st && st.dropSegments && st.dropSegments[input.dataset.idx];
        if (!seg) return;
        var v = input.value === '' ? null : parseFloat(input.value);
        seg.weight = (v != null && isNaN(v)) ? null : v;
      });
    });
    el.querySelectorAll('input[data-action="dropreps"]').forEach(function (input) {
      input.addEventListener('input', function () {
        var st = stateForKey(input.dataset.key);
        var seg = st && st.dropSegments && st.dropSegments[input.dataset.idx];
        if (!seg) return;
        var v = input.value === '' ? null : parseInt(input.value, 10);
        seg.reps = (v != null && isNaN(v)) ? null : v;
      });
    });

    // Weight / reps edits update the set live on 'input' and never re-render — a re-render on
    // blur would swallow the very next tap (e.g. tapping the checkbox right after typing).
    function afterSetEdit(s, input) {
      s.prefilled = false;
      input.classList.remove('prefilled');
      if (input.dataset.action === 'editweight') {
        var side = input.dataset.side === 'right' ? (s.right && s.right.weight) : s.weight;
        input.classList.toggle('needs-weight', !hasNum(side));
      }
      if (s.done && !isSetComplete(s)) {
        s.done = false; // cleared a number on a checked set -> it isn't done any more
        var row = el.querySelector('[data-setrow="' + s.localId + '"]');
        if (row) { row.classList.remove('done'); var cb = row.querySelector('.set-check'); if (cb) cb.checked = false; }
      }
    }
    el.querySelectorAll('input[data-action="editweight"]').forEach(function (input) {
      input.addEventListener('input', function () {
        var s = setById(input.dataset.setid);
        if (!s) return;
        var raw = input.value === '' ? null : parseFloat(input.value);
        var v = (raw != null && isNaN(raw)) ? null : raw;
        if (v != null && isBodyweightItem(itemById(s.itemLocalId))) v = Math.abs(v) * (s.sign === -1 ? -1 : 1);
        if (input.dataset.side === 'right') { if (!s.right) s.right = { weight: null, reps: null }; s.right.weight = v; }
        else s.weight = v;
        afterSetEdit(s, input);
      });
    });
    el.querySelectorAll('input[data-action="editreps"]').forEach(function (input) {
      input.addEventListener('input', function () {
        var s = setById(input.dataset.setid);
        if (!s) return;
        var raw = input.value === '' ? null : parseInt(input.value, 10);
        var v = (raw != null && isNaN(raw)) ? null : raw;
        if (input.dataset.side === 'right') { if (!s.right) s.right = { weight: null, reps: null }; s.right.reps = v; }
        else s.reps = v;
        afterSetEdit(s, input);
      });
    });
    // Tapping into any weight/reps field selects its current text, so typing
    // immediately overrides it instead of appending to it.
    el.querySelectorAll('input.cell-num').forEach(function (input) {
      input.addEventListener('focus', function () { input.select(); });
    });
  }

  // ---------- Swipe left on a set to delete it ----------
  var SWIPE_W = 104;
  var swipeDrag = null;
  var swipeSuppressClick = false;

  function closeAllSwipes(except) {
    document.querySelectorAll('.set-swipe.open').forEach(function (w) { if (w !== except) w.classList.remove('open'); });
  }
  function initSetSwipe() {
    var list = $('sessionExerciseList');
    document.addEventListener('pointerdown', function (ev) {
      var wrap = ev.target.closest ? ev.target.closest('.set-swipe') : null;
      if (!wrap || !list.contains(wrap)) { closeAllSwipes(null); return; }
      closeAllSwipes(wrap);
      if (ev.target.closest('.set-swipe-action')) return;
      // With a mouse, don't hijack drags that start on a field (text selection); touch can start anywhere.
      if (ev.pointerType === 'mouse' && (ev.button !== 0 || ev.target.closest('input,select,button,textarea,label'))) return;
      swipeDrag = { wrap: wrap, id: ev.pointerId, x: ev.clientX, y: ev.clientY, base: wrap.classList.contains('open') ? -SWIPE_W : 0, active: false, tx: 0 };
    });
    document.addEventListener('pointermove', function (ev) {
      if (!swipeDrag || ev.pointerId !== swipeDrag.id) return;
      var dx = ev.clientX - swipeDrag.x, dy = ev.clientY - swipeDrag.y;
      if (!swipeDrag.active) {
        if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) return;
        swipeDrag.active = true;
        swipeDrag.wrap.classList.add('dragging');
        try { swipeDrag.wrap.setPointerCapture(ev.pointerId); } catch (e) { /* not fatal */ }
      }
      var tx = Math.max(-SWIPE_W - 24, Math.min(0, swipeDrag.base + dx));
      swipeDrag.tx = tx;
      swipeDrag.wrap.querySelector('.set-swipe-content').style.transform = 'translateX(' + tx + 'px)';
    });
    function endDrag(ev) {
      if (!swipeDrag || ev.pointerId !== swipeDrag.id) return;
      var d = swipeDrag;
      swipeDrag = null;
      if (!d.active) return;
      d.wrap.classList.remove('dragging');
      d.wrap.querySelector('.set-swipe-content').style.transform = '';
      d.wrap.classList.toggle('open', d.tx < -SWIPE_W / 2);
      swipeSuppressClick = true; // the click that follows a drag shouldn't press anything
      setTimeout(function () { swipeSuppressClick = false; }, 0);
    }
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);
    document.addEventListener('click', function (ev) {
      if (swipeSuppressClick) { ev.stopPropagation(); ev.preventDefault(); }
    }, true);
  }

  function beginEditWorkout(workout) {
    showScreen('log');
    openLogSetup({
      heading: 'Edit Workout',
      date: workout.date,
      name: workout.name === 'Workout' ? '' : (workout.name || ''),
      showTemplatePicker: false,
      buttonLabel: 'Continue',
      onConfirm: function (date, name) { loadWorkoutIntoSessionAfterSetup(workout, date, name); },
      onCancel: function () {
        $('logSetupView').style.display = 'none';
        $('logStartView').style.display = 'block';
        showScreen('history');
      }
    });
  }

  // Raw DB rows -> in-session logical sets. The one place this reconstruction
  // happens for editing (history view has its own copy, groupSetsByBlock,
  // since it doesn't need editable session state). Two rows sharing
  // (blockId, exerciseId, position) with side left/right are the two sides
  // of ONE logged set — getting this right is what lets editing a workout
  // round-trip without silently dropping tempo/failure/drops/side.
  function loadWorkoutIntoSessionAfterSetup(workout, date, name) {
    session = { id: workout.id, date: date, name: name, items: [], sets: [] };
    sessionMode = 'edit';
    itemMode = {};
    expandedSetPanels = {};

    var itemKeyMap = {};
    var byPosition = {}; // "blockId|exerciseId|position" -> { itemLocalId, left, right, plain }
    var posOrder = [];
    workout.sets.forEach(function (s) {
      var itemKey = s.blockId + '|' + s.exerciseId;
      if (!itemKeyMap[itemKey]) {
        var localId = uid();
        itemKeyMap[itemKey] = localId;
        session.items.push({ localId: localId, exerciseId: s.exerciseId, name: s.exerciseName, category: s.exerciseCategory, equipment: s.exerciseEquipment || '', blockId: s.blockId });
      }
      var posKey = itemKey + '|' + s.position;
      if (!byPosition[posKey]) { byPosition[posKey] = { itemLocalId: itemKeyMap[itemKey] }; posOrder.push(posKey); }
      if (s.side === 'left') byPosition[posKey].left = s;
      else if (s.side === 'right') byPosition[posKey].right = s;
      else byPosition[posKey].plain = s;
    });

    posOrder.forEach(function (posKey) {
      var b = byPosition[posKey];
      if (b.left || b.right) {
        var primary = b.left || b.right;
        session.sets.push({
          localId: uid(), itemLocalId: b.itemLocalId, mode: 'independent',
          weight: b.left ? b.left.weight : null, reps: b.left ? b.left.reps : null,
          right: b.right ? { weight: b.right.weight, reps: b.right.reps } : null,
          toFailure: !!primary.toFailure, tempo: primary.tempo || null, dropSegments: primary.dropSegments || [],
          sign: primary.weight < 0 ? -1 : 1,
          done: true, prefilled: false // everything already saved counts as done
        });
        itemMode[b.itemLocalId] = 'independent';
      } else {
        var s = b.plain;
        session.sets.push({
          localId: uid(), itemLocalId: b.itemLocalId, mode: s.side === 'both' ? 'both' : 'bilateral',
          weight: s.weight, reps: s.reps, right: null,
          toFailure: !!s.toFailure, tempo: s.tempo || null, dropSegments: s.dropSegments || [],
          sign: s.weight < 0 ? -1 : 1,
          done: true, prefilled: false
        });
        if (s.side === 'both') itemMode[b.itemLocalId] = 'both';
      }
    });

    if (!exercisesCache.length) {
      apiGet('getExercises').then(function (data) { exercisesCache = data; }).catch(function () {});
    }
    showLogActiveView();
  }

  // In-session logical set -> the wire shape supabase-api.js's buildSetRows expects.
  // Independent mode sends {left, right} (each optional — one side can be logged
  // without the other); everything else sends flat weight/reps + side.
  function toWireSet(s) {
    // half-filled drop rows aren't performances — leave them out
    var drops = (s.dropSegments || []).filter(function (d) { return hasNum(d.weight) && hasNum(d.reps); });
    if (s.mode === 'independent') {
      var w = { toFailure: s.toFailure, tempo: s.tempo, dropSegments: drops };
      if (hasNum(s.weight) && hasNum(s.reps)) w.left = { weight: s.weight, reps: s.reps };
      if (s.right && hasNum(s.right.weight) && hasNum(s.right.reps)) w.right = { weight: s.right.weight, reps: s.right.reps };
      return w;
    }
    return {
      weight: s.weight, reps: s.reps, side: s.mode === 'both' ? 'both' : null,
      toFailure: s.toFailure, tempo: s.tempo, dropSegments: drops
    };
  }

  $('saveWorkoutBtn').addEventListener('click', function () {
    if (!session || !session.items.length) { showToast('Add at least one exercise', true); return; }
    if (!session.date) { showToast('Pick a date', true); return; }

    // Only sets whose checkbox is checked are saved — nothing is added on Save.
    var loggedSets = session.sets.filter(function (s) { return s.done && isSetComplete(s); });
    if (!loggedSets.length) { showToast('Check off at least one set to save', true); return; }

    // Safety net: a set with numbers in it that was never checked off (most likely the last
    // set — easy to forget) would be dropped silently, so ask first. Blank sets don't count.
    var unchecked = session.sets.filter(function (s) { return !s.done && isSetComplete(s); });
    if (unchecked.length && !confirm(unchecked.length + (unchecked.length === 1 ? ' set isn\'t' : ' sets aren\'t') + ' checked off, so ' + (unchecked.length === 1 ? 'it' : 'they') + ' won\'t be saved. Save anyway?')) return;

    // Build payload per item (not per block) since a superset block can hold
    // sets for multiple different exerciseIds sharing the same blockId.
    var payloadItems = session.items.map(function (item) {
      return {
        exerciseId: item.exerciseId,
        blockId: item.blockId,
        sets: loggedSets.filter(function (s) { return s.itemLocalId === item.localId; }).map(toWireSet)
      };
    }).filter(function (i) { return i.sets.length > 0; });

    var workoutName = (session.name || '').trim() || 'Workout';
    var action = sessionMode === 'edit' ? 'updateWorkout' : 'saveWorkout';
    var payload = sessionMode === 'edit'
      ? { id: session.id, date: session.date, name: workoutName, items: payloadItems }
      : { date: session.date, name: workoutName, items: payloadItems };

    $('saveWorkoutBtn').disabled = true;
    apiPost(action, payload).then(function () {
      showToast(sessionMode === 'edit' ? 'Workout updated' : 'Workout saved');
      session = null;
      $('logActiveView').style.display = 'none';
      $('logStartView').style.display = 'block';
      showScreen('history');
    }).catch(function (err) {
      showToast(err.message, true);
    }).finally(function () {
      $('saveWorkoutBtn').disabled = false;
    });
  });

  // ---------- Bodyweight ----------
  // One entry per day (weights in lbs). The "current" weight is the entry with the
  // latest DATE — not the latest one typed in — so back-filling an old day doesn't change it.
  var bodyweightLogs = []; // [{id, date, weight}], newest date first
  var bodyweightLoaded = false;

  function fmtWeight(v) { return String(Math.round(Number(v) * 100) / 100); }
  function fmtSigned(v) {
    v = Math.round(v * 100) / 100;
    return (v > 0 ? '+' : v < 0 ? '−' : '') + fmtWeight(Math.abs(v));
  }

  function loadBodyweight() {
    return apiGet('getBodyweightLogs').then(function (rows) {
      bodyweightLogs = rows;
      bodyweightLoaded = true;
      renderDrawerWeight();
      return rows;
    });
  }

  function renderDrawerWeight() {
    var latest = bodyweightLogs[0];
    $('drawerWeight').innerHTML = 'Current Weight: ' + (latest
      ? '<strong>' + escapeHtml(fmtWeight(latest.weight)) + ' lbs</strong><span class="muted">' + escapeHtml(prettyDate(latest.date)) + '</span>'
      : '<span class="muted">—</span>');
  }

  // Add (no argument) or edit/delete (an existing entry) a bodyweight log.
  function openBodyweightModal(entry) {
    var editing = !!entry;
    var last = bodyweightLogs[0];
    var body =
      '<div class="field"><label for="bwDateInput">Date</label>' +
        '<input type="date" id="bwDateInput" max="' + todayISO() + '" value="' + escapeHtml(editing ? entry.date : todayISO()) + '"></div>' +
      '<div class="field"><label for="bwWeightInput">Weight (lbs)</label>' +
        '<input type="text" inputmode="decimal" id="bwWeightInput" autocomplete="off" placeholder="' + escapeHtml(last ? 'Last: ' + fmtWeight(last.weight) : 'e.g. 180') + '"' +
        ' value="' + escapeHtml(editing ? fmtWeight(entry.weight) : '') + '"></div>' +
      '<button class="btn block" id="bwSaveBtn">' + (editing ? 'Save Changes' : 'Save') + '</button>' +
      (editing ? '<button class="btn-sm danger" id="bwDeleteBtn" style="width:100%; margin-top:8px;">Delete Entry</button>' : '');

    var backdrop = showModal(editing ? 'Edit Body Weight' : 'Log Body Weight', body, true);

    // Refresh the cache (and drawer), repaint History if it's the visible screen, then close.
    function finish(message) {
      return loadBodyweight().then(function () {
        if ($('screen-history').classList.contains('active')) renderHistory();
        closeModal(backdrop);
        showToast(message);
      });
    }

    $('bwSaveBtn').addEventListener('click', function () {
      var date = $('bwDateInput').value;
      var weight = parseFloat($('bwWeightInput').value.replace(',', '.'));
      if (!date) { showToast('Pick a date', true); return; }
      if (date > todayISO()) { showToast("Date can't be in the future", true); return; }
      if (!isFinite(weight) || weight <= 0) { showToast('Enter a valid weight', true); return; }

      $('bwSaveBtn').disabled = true;
      var req = editing
        ? apiPost('updateBodyweight', { id: entry.id, date: date, weight: weight })
        : apiPost('saveBodyweight', { date: date, weight: weight });
      req.then(function () {
        return finish(editing ? 'Body weight updated' : 'Body weight logged');
      }).catch(function (err) {
        showToast(err.message, true);
        $('bwSaveBtn').disabled = false;
      });
    });

    if (editing) {
      $('bwDeleteBtn').addEventListener('click', function () {
        if (!confirm('Delete this body weight entry?')) return;
        apiPost('deleteBodyweight', { id: entry.id })
          .then(function () { return finish('Entry deleted'); })
          .catch(function (err) { showToast(err.message, true); });
      });
    }
  }

  $('logBodyweightBtn').addEventListener('click', function () { openBodyweightModal(); });

  // ---------- History ----------
  var MONTHS =['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var historyWorkouts = [];
  var historyLoaded = false;
  var calYear = new Date().getFullYear();
  var calMonthIdx = new Date().getMonth();
  var historyTab = 'workout'; // 'workout' | 'bodyweight'
  // Each tab remembers its own selection. No dates = show everything. Only `start` = one day.
  // `start` + `end` = a range (start <= end).
  var histSel = { workout: { start: null, end: null }, bodyweight: { start: null, end: null } };
  function sel() { return histSel[historyTab]; }

  function pad2(n) { return String(n).padStart(2, '0'); }
  function prettyDate(iso) {
    var p = iso.split('-');
    var txt = MONTHS[Number(p[1]) - 1].slice(0, 3) + ' ' + Number(p[2]);
    return Number(p[0]) === new Date().getFullYear() ? txt : txt + ', ' + p[0];
  }

  // Tap a day: first tap = that day; tapping a different day next = a range between them;
  // tapping the same single day again = clear; tapping after a finished range starts over.
  function pickCalendarDate(iso) {
    var cur = sel();
    if (!cur.start || cur.end) histSel[historyTab] = { start: iso, end: null };
    else if (iso === cur.start) histSel[historyTab] = { start: null, end: null };
    else histSel[historyTab] = { start: iso < cur.start ? iso : cur.start, end: iso < cur.start ? cur.start : iso };
    renderHistory();
  }

  // Filters any list of {date} rows down to the current tab's selection.
  function inSelection(list) {
    var s = sel().start, e = sel().end;
    if (!s) return list;
    return list.filter(function (x) { return e ? (x.date >= s && x.date <= e) : x.date === s; });
  }
  function selectionLabel(allLabel) {
    var cur = sel();
    if (!cur.start) return allLabel;
    return cur.end ? prettyDate(cur.start) + ' – ' + prettyDate(cur.end) : prettyDate(cur.start);
  }

  function renderCalendar() {
    var today = todayISO();
    var isBw = historyTab === 'bodyweight';
    var marked = {}; // days that get the square outline: a workout (Workout tab) or a weigh-in (Bodyweight tab)
    (isBw ? bodyweightLogs : historyWorkouts).forEach(function (x) { marked[x.date] = true; });
    var s = sel().start, e = sel().end;
    var leading = new Date(calYear, calMonthIdx, 1).getDay(); // weeks start on Sunday
    var daysInMonth = new Date(calYear, calMonthIdx + 1, 0).getDate();

    var cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');
    for (var i = 0; i < leading; i++) cells += '<div class="cal-day blank"></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var iso = calYear + '-' + pad2(calMonthIdx + 1) + '-' + pad2(d);
      var cls = 'cal-day';
      if (iso === today) cls += ' is-today';
      if (marked[iso]) cls += ' has-workout';
      if (s && !e && iso === s) cls += ' sel sel-single';
      else if (s && e) {
        if (iso === s) cls += ' sel sel-start';
        else if (iso === e) cls += ' sel sel-end';
        else if (iso > s && iso < e) cls += ' sel';
      }
      cells += '<button type="button" class="' + cls + '" data-date="' + iso + '" aria-label="' + prettyDate(iso) + (marked[iso] ? (isBw ? ', weight logged' : ', workout') : '') + '">' +
        '<span class="cal-box"><span class="cal-num">' + d + '</span></span></button>';
    }

    $('historyCalendar').innerHTML = '<div class="card cal">' +
      '<div class="cal-head">' +
        '<button type="button" class="cal-nav" data-cal="prev" aria-label="Previous month">‹</button>' +
        '<div class="cal-title">' + MONTHS[calMonthIdx] + ' ' + calYear + '</div>' +
        '<button type="button" class="cal-nav" data-cal="next" aria-label="Next month">›</button>' +
      '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="cal-foot"><span class="muted">' + (s && !e ? 'Tap another day for a range' : 'Tap a day, or two for a range') + '</span>' +
        '<span class="cal-actions">' +
          '<button type="button" class="btn-sm" data-cal="today">Today</button>' +
          (s ? '<button type="button" class="btn-sm" data-cal="clear">Clear</button>' : '') +
        '</span></div>' +
    '</div>';
  }

  function renderHistoryCards() {
    var el = $('historyCards');
    if (!historyLoaded) { el.innerHTML = '<div class="muted">Loading...</div>'; return; }
    if (!historyWorkouts.length) { el.innerHTML = '<div class="empty-state">No workouts logged yet.</div>'; return; }
    var list = inSelection(historyWorkouts);
    var heading = '<div class="cal-filter-label">' + escapeHtml(selectionLabel('All workouts')) + ' · ' + list.length + ' workout' + (list.length === 1 ? '' : 's') + '</div>';
    if (!list.length) {
      el.innerHTML = heading + '<div class="empty-state" style="padding:24px 20px;">No workouts ' + (sel().end ? 'in this range.' : 'on this day.') + '</div>';
      return;
    }
    el.innerHTML = heading + list.map(function (w) {
      return '<div class="card" data-id="' + escapeHtml(w.id) + '" style="cursor:pointer;">' +
        '<div class="name" style="font-weight:700; margin-bottom:2px;">' + escapeHtml(w.date) + '</div>' +
        '<div style="font-weight:600; margin-bottom:4px;">' + escapeHtml(w.name || 'Workout') + '</div>' +
        '<div class="muted">' + w.exerciseCount + ' exercise' + (w.exerciseCount === 1 ? '' : 's') +
        ' · ' + w.setCount + ' set' + (w.setCount === 1 ? '' : 's') + '</div>' +
      '</div>';
    }).join('');
  }

  function renderBodyweightHistory() {
    var el = $('historyCards');
    if (!bodyweightLoaded) { el.innerHTML = '<div class="muted">Loading...</div>'; return; }
    if (!bodyweightLogs.length) {
      el.innerHTML = '<div class="empty-state">No body weight logged yet.<br>Use “Log Body Weight” on the Log tab.</div>';
      return;
    }
    var list = inSelection(bodyweightLogs); // newest first
    var heading = '<div class="cal-filter-label">' + escapeHtml(selectionLabel('All entries')) + ' · ' + list.length + (list.length === 1 ? ' entry' : ' entries') + '</div>';
    if (!list.length) {
      el.innerHTML = heading + '<div class="empty-state" style="padding:24px 20px;">No entries ' + (sel().end ? 'in this range.' : 'on this day.') + '</div>';
      return;
    }

    // Change across the selection = newest entry minus oldest entry in it (needs at least two).
    var change = list.length > 1 ? list[0].weight - list[list.length - 1].weight : null;
    var summary = '<div class="bw-summary">' +
      '<div class="bw-stat"><div class="k">Latest</div><div class="v">' + escapeHtml(fmtWeight(list[0].weight)) + ' lbs</div></div>' +
      '<div class="bw-stat"><div class="k">Change</div><div class="v">' + (change === null ? '—' : escapeHtml(fmtSigned(change)) + ' lbs') + '</div></div>' +
    '</div>';

    // Each row's delta is against the previous entry in the FULL history (not just this selection).
    var rows = list.map(function (x) {
      var idx = bodyweightLogs.indexOf(x);
      var prev = bodyweightLogs[idx + 1];
      var delta = prev ? fmtSigned(x.weight - prev.weight) + ' lbs' : 'First entry';
      if (prev && Math.round((x.weight - prev.weight) * 100) === 0) delta = 'No change';
      return '<div class="card bw-row" data-bwid="' + escapeHtml(x.id) + '" style="cursor:pointer;">' +
        '<div><div style="font-weight:700; margin-bottom:2px;">' + escapeHtml(x.date) + '</div><div class="muted">' + escapeHtml(delta) + '</div></div>' +
        '<div class="bw-weight">' + escapeHtml(fmtWeight(x.weight)) + ' <span class="muted">lbs</span></div>' +
      '</div>';
    }).join('');
    el.innerHTML = heading + summary + rows;
  }

  function renderHistory() {
    renderCalendar();
    if (historyTab === 'bodyweight') renderBodyweightHistory();
    else renderHistoryCards();
  }

  function switchHistoryTab(tab) {
    historyTab = tab;
    document.querySelectorAll('#historySubnav .lib-subnav-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.histtab === tab);
    });
    loadHistory();
  }
  document.querySelectorAll('#historySubnav .lib-subnav-btn').forEach(function (b) {
    b.addEventListener('click', function () { switchHistoryTab(b.dataset.histtab); });
  });

  $('historyCalendar').addEventListener('click', function (ev) {
    var day = ev.target.closest('[data-date]');
    if (day) { pickCalendarDate(day.dataset.date); return; }
    var nav = ev.target.closest('[data-cal]');
    if (!nav) return;
    var act = nav.dataset.cal;
    if (act === 'prev' || act === 'next') {
      calMonthIdx += act === 'next' ? 1 : -1;
      if (calMonthIdx < 0) { calMonthIdx = 11; calYear--; }
      if (calMonthIdx > 11) { calMonthIdx = 0; calYear++; }
      renderCalendar();
    } else if (act === 'today') {
      calYear = new Date().getFullYear();
      calMonthIdx = new Date().getMonth();
      renderCalendar();
    } else if (act === 'clear') {
      histSel[historyTab] = { start: null, end: null };
      renderHistory();
    }
  });
  $('historyCards').addEventListener('click', function (ev) {
    var card = ev.target.closest('.card[data-id]');
    if (card) { openWorkoutDetail(card.dataset.id); return; }
    var bw = ev.target.closest('.card[data-bwid]');
    if (bw) {
      var entry = bodyweightLogs.filter(function (x) { return x.id === bw.dataset.bwid; })[0];
      if (entry) openBodyweightModal(entry);
    }
  });

  function loadHistory() {
    renderHistory(); // calendar (and any already-loaded cards) show immediately; refreshed once the fetch returns
    var tab = historyTab;
    // If the user flips tabs mid-fetch, the result still lands in its cache but only repaints the tab that's showing.
    function fail(err) {
      if (historyTab !== tab) return;
      $('historyCards').innerHTML = '<div class="empty-state">Failed to load: ' + escapeHtml(err.message) + '</div>';
    }
    if (tab === 'bodyweight') {
      loadBodyweight().then(renderHistory).catch(fail);
      return;
    }
    apiGet('getWorkouts').then(function (data) {
      historyWorkouts = data;
      historyLoaded = true;
      renderHistory();
    }).catch(fail);
  }

  function openWorkoutDetail(id) {
    apiGet('getWorkout', { id: id }).then(function (w) {
      var blocks = groupSetsByBlock(w.sets);

      // One logged set as table rows. `labelText` is the first-column text ("Set 2" for a
      // normal exercise, the exercise name inside a superset round).
      function histSetHtml(s, labelText, g) {
        var isBw = g.exerciseEquipment === 'Bodyweight';
        var defaultTempo = exerciseDefaultTempo(g.exerciseId);
        function weightLabel(v) { return isBw && v > 0 ? '+' + v : String(v); }
        var primary = s.primary;
        var effTempo = primary.tempo || defaultTempo;
        var badges =
          (primary.toFailure ? '<span class="set-badge failure">Failure</span>' : '') +
          (effTempo ? '<span class="set-badge tempo">' + escapeHtml(tempoLabel(effTempo)) + '</span>' : '');
        var badgesHtml = badges ? '<span class="set-badges">' + badges + '</span>' : '';
        var html;
        if (s.mode === 'independent') {
          html =
            '<div class="set-table-row"><span>' + labelText + badgesHtml + '</span><span>' +
              (s.left ? escapeHtml(weightLabel(s.left.weight)) + ' lbs' : '—') + '</span><span>' +
              (s.left ? escapeHtml(s.left.reps) + ' reps' : '—') + '</span><span></span></div>' +
            '<div class="set-table-row sub"><span>↳ R</span><span>' +
              (s.right ? escapeHtml(weightLabel(s.right.weight)) + ' lbs' : '—') + '</span><span>' +
              (s.right ? escapeHtml(s.right.reps) + ' reps' : '—') + '</span><span></span></div>';
        } else {
          var label = labelText + (s.mode === 'both' ? ' (per side)' : '');
          html = '<div class="set-table-row"><span>' + label + badgesHtml + '</span><span>' + escapeHtml(weightLabel(s.weight)) + ' lbs</span><span>' + escapeHtml(s.reps) + ' reps</span><span></span></div>';
          (primary.dropSegments || []).forEach(function (seg, dIdx) {
            html += '<div class="set-table-row sub"><span>↳ Drop ' + (dIdx + 1) + '</span><span>' + escapeHtml(weightLabel(seg.weight)) + ' lbs</span><span>' + escapeHtml(seg.reps) + ' reps</span><span></span></div>';
          });
        }
        return html;
      }

      var body = blocks.map(function (block) {
        if (block.exerciseGroups.length > 1) {
          // A superset reads as rounds: "Set 1" holds the 1st set of every exercise in the group, and so on.
          var rounds = Math.max.apply(null, block.exerciseGroups.map(function (g) { return g.sets.length; }));
          var roundsHtml = '';
          for (var k = 0; k < rounds; k++) {
            var rows = block.exerciseGroups.map(function (g) {
              return g.sets[k] ? histSetHtml(g.sets[k], escapeHtml(g.exerciseName), g) : '';
            }).join('');
            roundsHtml += '<div class="superset-block"><div class="superset-label">Set ' + (k + 1) + '</div><div class="set-table">' + rows + '</div></div>';
          }
          return '<div class="superset-group"><div class="superset-label-row"><div class="superset-label">🔗 ' + supersetLabel(block.exerciseGroups.length) + '</div></div>' + roundsHtml + '</div>';
        }
        return block.exerciseGroups.map(function (g) {
          var setsHtml = g.sets.map(function (s, idx) { return histSetHtml(s, 'Set ' + (idx + 1), g); }).join('');
          return '<div class="block-card"><div class="name">' + escapeHtml(g.exerciseName) +
            '</div>' + chipHtml(g.exerciseCategory) +
            '<div class="set-table">' + setsHtml + '</div></div>';
        }).join('');
      }).join('') || '<div class="empty-state">No sets recorded.</div>';

      body += '<div class="modal-actions">' +
        '<button class="btn secondary" id="detailEditBtn">Edit</button>' +
        '<button class="btn danger" id="detailDeleteBtn">Delete</button>' +
      '</div>';

      var backdrop = showModal(w.date + ' — ' + (w.name || 'Workout'), body);
      backdrop.querySelector('#detailEditBtn').addEventListener('click', function () {
        closeModal(backdrop);
        beginEditWorkout(w);
      });
      backdrop.querySelector('#detailDeleteBtn').addEventListener('click', function () {
        closeModal(backdrop);
        confirmDeleteWorkout(w.id);
      });
    }).catch(function (err) { showToast(err.message, true); });
  }

  function confirmDeleteWorkout(id) {
    var body = '<p>Are you sure you want to erase this workout?</p>' +
      '<div class="modal-actions">' +
        '<button class="btn secondary" id="confirmNoBtn">No</button>' +
        '<button class="btn danger" id="confirmDeleteBtn">Delete</button>' +
      '</div>';
    var backdrop = showModal('Delete Workout', body, true);
    backdrop.querySelector('#confirmNoBtn').addEventListener('click', function () { closeModal(backdrop); });
    backdrop.querySelector('#confirmDeleteBtn').addEventListener('click', function () {
      apiPost('deleteWorkout', { id: id }).then(function () {
        closeModal(backdrop);
        showToast('Workout deleted');
        loadHistory();
      }).catch(function (err) { showToast(err.message, true); });
    });
  }

  // Raw DB rows -> logical sets for read-only history display. Two rows sharing
  // (exerciseId, position) with side left/right are the two sides of one set —
  // same reconstruction rule as loadWorkoutIntoSessionAfterSetup, just producing
  // a display-shaped object instead of editable session state.
  function groupSetsByBlock(sets) {
    var blockOrder = [], blockMap = {};
    sets.forEach(function (s) {
      if (!blockMap[s.blockId]) { blockMap[s.blockId] = { blockId: s.blockId, exOrder: [], exMap: {} }; blockOrder.push(s.blockId); }
      var b = blockMap[s.blockId];
      if (!b.exMap[s.exerciseId]) {
        b.exMap[s.exerciseId] = {
          exerciseId: s.exerciseId, exerciseName: s.exerciseName, exerciseCategory: s.exerciseCategory,
          exerciseEquipment: s.exerciseEquipment, byPosition: {}, posOrder: []
        };
        b.exOrder.push(s.exerciseId);
      }
      var ex = b.exMap[s.exerciseId];
      if (!ex.byPosition[s.position]) { ex.byPosition[s.position] = {}; ex.posOrder.push(s.position); }
      var slot = ex.byPosition[s.position];
      if (s.side === 'left') slot.left = s;
      else if (s.side === 'right') slot.right = s;
      else slot.plain = s;
    });
    return blockOrder.map(function (blockId) {
      var b = blockMap[blockId];
      return {
        blockId: blockId,
        exerciseGroups: b.exOrder.map(function (exId) {
          var ex = b.exMap[exId];
          var logicalSets = ex.posOrder.map(function (pos) {
            var slot = ex.byPosition[pos];
            if (slot.left || slot.right) {
              return { mode: 'independent', left: slot.left, right: slot.right, primary: slot.left || slot.right };
            }
            return { mode: slot.plain.side === 'both' ? 'both' : 'bilateral', weight: slot.plain.weight, reps: slot.plain.reps, primary: slot.plain };
          });
          return {
            exerciseId: ex.exerciseId, exerciseName: ex.exerciseName, exerciseCategory: ex.exerciseCategory,
            exerciseEquipment: ex.exerciseEquipment, sets: logicalSets
          };
        })
      };
    });
  }

  // ---------- Modal helpers ----------
  function showModal(title, bodyHtml, centered) {
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop' + (centered ? ' center' : '');
    backdrop.innerHTML = '<div class="modal-sheet">' +
      '<div class="modal-sheet-head"><h3>' + escapeHtml(title) + '</h3><button class="icon-btn" id="closeModalBtn">Close</button></div>' +
      bodyHtml + '</div>';
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeModal(backdrop); });
    backdrop.querySelector('#closeModalBtn').addEventListener('click', function () { closeModal(backdrop); });
    return backdrop;
  }
  function closeModal(backdrop) {
    if (backdrop && backdrop.dataset.locked === '1') return; // e.g. first-run account setup: must Save to proceed
    if (backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
  }

  // ---------- Init ----------
  function showSplash() {
    var splash = $('splashScreen');
    if (!splash) return;
    // The splash image is embedded in the page, so it's already showing; just hold it a moment, then fade out.
    setTimeout(function () {
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 500);
    }, 1400);
  }

  function init() {
    initSetSwipe();
    window.WorkoutAPI.getSession().then(function (session) {
      if (session) {
        showScreen('library');
        loadBodyweight().catch(function () { /* drawer/history surface this themselves when opened */ });
      } else {
        openSignInModal(true);
      }
      showSplash();
    });
  }

  init();
})();
</script>

</body>
</html>

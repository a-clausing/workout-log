<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Workout Log</title>
<style>
  :root {
    --bg: #111418;
    --card: #1b1f26;
    --card-border: #2a2f38;
    --text: #eef1f5;
    --text-dim: #9aa4b2;
    --accent: #4f8cff;
    --accent-dim: #2a4a85;
    --danger: #e05656;
    --ok: #3fb37f;
    --radius: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
  }
  body { padding-bottom: 76px; }
  h1, h2, h3 { margin: 0 0 8px; }
  header.topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--bg);
    border-bottom: 1px solid var(--card-border);
  }
  header.topbar h1 { font-size: 20px; }
  .icon-btn {
    background: none; border: 1px solid var(--card-border); color: var(--text-dim);
    border-radius: 8px; padding: 8px 10px; font-size: 14px; cursor: pointer;
  }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .screen { display: none; }
  .screen.active { display: block; }

  input, select, button, textarea {
    font-family: inherit; font-size: 16px;
  }
  input[type=text], input[type=number], input[type=date], select {
    width: 100%; padding: 12px; border-radius: 8px;
    border: 1px solid var(--card-border); background: #10141a; color: var(--text);
  }
  input::placeholder { color: var(--text-dim); }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  button.btn {
    display: inline-block; padding: 12px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
    min-height: 44px;
  }
  button.btn.secondary { background: #262c36; color: var(--text); }
  button.btn.danger { background: var(--danger); color: #fff; }
  button.btn.block { width: 100%; }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
  button.btn-sm {
    padding: 6px 10px; border-radius: 6px; border: none; background: #262c36;
    color: var(--text); font-size: 13px; cursor: pointer; min-height: 32px;
  }
  button.btn-sm.danger { background: rgba(224,86,86,0.15); color: var(--danger); }
  button.btn-sm.active { background: var(--accent); color: #fff; }

  .card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
  }
  .muted { color: var(--text-dim); font-size: 14px; }
  .chip {
    display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-dim); color: #cfe0ff;
  }
  .exercise-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--card-border);
    cursor: pointer;
  }
  .exercise-row:last-child { border-bottom: none; }
  .exercise-row:active { background: #20252d; }
  .exercise-row .name { font-weight: 600; }

  nav.bottomnav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; background: #161a20; border-top: 1px solid var(--card-border);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav.bottomnav button {
    flex: 1; background: none; border: none; color: var(--text-dim);
    padding: 10px 4px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer;
  }
  nav.bottomnav button.active { color: var(--accent); background: rgba(79,140,255,0.1); }

  .superset-block {
    border: 1.5px solid var(--accent); border-radius: var(--radius);
    padding: 12px; margin-bottom: 14px; background: rgba(79,140,255,0.06);
  }
  .superset-label {
    font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 8px;
  }
  .block-card { padding: 12px 0; border-top: 1px solid var(--card-border); }
  .block-card:first-child { border-top: none; }
  .superset-block .block-card { padding: 0; border-top: none; }
  .block-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .block-card-head .titles { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .select-check {
    width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--card-border);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    color: transparent; font-size: 14px; flex-shrink: 0;
  }
  .select-check.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .remove-x { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 2px 6px; }

  /* Spreadsheet-style set table */
  .set-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .set-table-row {
    display: grid; grid-template-columns: 1fr 66px 54px 30px; gap: 8px; align-items: center;
    padding: 7px 0; border-bottom: 1px solid var(--card-border);
  }
  .set-table-row.head {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim);
    border-bottom: 1px solid var(--card-border); padding-bottom: 6px;
  }
  .set-table-row:last-child { border-bottom: none; }
  .set-table-row .cell-exercise { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-table-row select.cell-exercise-select { padding: 6px 4px; font-size: 13px; }
  .set-table-row input.cell-num {
    padding: 8px 4px; text-align: center; width: 100%;
  }
  .set-table-row .del {
    color: var(--danger); background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px;
  }
  .set-table-row .add-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    width: 26px; height: 26px; font-size: 16px; line-height: 1; cursor: pointer;
  }
  .set-table-row .add-btn:disabled { opacity: 0.35; }

  .remove-x { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 2px 6px; }

  .search-results { max-height: 260px; overflow-y: auto; margin-top: 8px; }
  .search-results .exercise-row { cursor: pointer; }
  .search-results .exercise-row:active { background: #20252d; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 20;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.center { align-items: center; padding: 20px; }
  .modal-sheet {
    background: var(--card); border-radius: 14px 14px 0 0; padding: 18px 16px 24px;
    width: 100%; max-width: 640px; max-height: 82vh; overflow-y: auto;
  }
  .modal-backdrop.center .modal-sheet { border-radius: 14px; max-height: 90vh; }
  .modal-sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions > * { flex: 1; }

  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: #262c36; color: var(--text); padding: 10px 16px; border-radius: 8px;
    font-size: 14px; z-index: 30; display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  #toast.error { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<header class="topbar">
  <h1>🏋️ Workout Log</h1>
  <button class="icon-btn" id="settingsBtn">Settings</button>
</header>

<main>

  <!-- SETTINGS SCREEN -->
  <section class="screen" id="screen-settings">
    <h2>Settings</h2>
    <p class="muted">Paste the deployed Google Apps Script Web App URL. It's saved on this device only.</p>
    <div class="field">
      <label for="apiUrlInput">Web App URL</label>
      <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <button class="btn block" id="saveApiUrlBtn">Save</button>
    <p class="muted" id="settingsStatus" style="margin-top:10px;"></p>
  </section>

  <!-- LIBRARY SCREEN -->
  <section class="screen" id="screen-library">
    <h2>Exercise Library</h2>
    <div class="field">
      <input type="text" id="librarySearch" placeholder="Search exercises...">
    </div>
    <div class="field">
      <select id="libraryCategoryFilter">
        <option value="">All categories</option>
      </select>
    </div>
    <button class="btn secondary block" id="toggleAddExerciseBtn" style="margin-bottom:14px;">+ Add Exercise</button>

    <div class="card" id="addExerciseForm" style="display:none;">
      <div class="field">
        <label for="newExName">Name</label>
        <input type="text" id="newExName" placeholder="e.g. Barbell Squat">
      </div>
      <div class="field" id="newExCategoryField"></div>
      <button class="btn block" id="submitNewExerciseBtn">Save Exercise</button>
    </div>

    <p class="muted" style="margin-bottom:6px;">Tap an exercise to edit it.</p>
    <div id="libraryList"></div>
  </section>

  <!-- LOG WORKOUT SCREEN -->
  <section class="screen" id="screen-log">
    <div id="logStartView">
      <h2>Log Workout</h2>
      <p class="muted">Start a new session to begin adding exercises and sets.</p>
      <button class="btn block" id="startWorkoutBtn">Log Workout</button>
    </div>

    <div id="logActiveView" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h2 id="logHeading">Log Workout</h2>
        <button class="btn-sm danger" id="discardWorkoutBtn">Discard</button>
      </div>

      <div class="field">
        <label for="sessionDateInput">Date</label>
        <input type="date" id="sessionDateInput">
      </div>

      <div class="field">
        <input type="text" id="sessionExerciseSearch" placeholder="Search exercises to add...">
        <div class="search-results" id="sessionSearchResults"></div>
      </div>

      <div id="linkBar" style="display:none; margin-bottom:12px;">
        <button class="btn secondary" id="linkSelectedBtn">Link as Superset</button>
        <button class="btn-sm" id="cancelSelectBtn" style="margin-left:8px;">Cancel</button>
      </div>

      <div id="sessionExerciseList"></div>

      <button class="btn block" id="saveWorkoutBtn" style="margin-top:16px;">Save Workout</button>
    </div>
  </section>

  <!-- HISTORY SCREEN -->
  <section class="screen" id="screen-history">
    <h2>History</h2>
    <div id="historyList"></div>
  </section>

</main>

<nav class="bottomnav">
  <button data-screen="library">Library</button>
  <button data-screen="log">Log</button>
  <button data-screen="history">History</button>
</nav>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var NEW_CATEGORY_VALUE = '__new__';

  // ---------- State ----------
  var API_URL = localStorage.getItem('workoutlog.apiUrl') || '';
  var exercisesCache = [];

  // Active in-progress (or being-edited) workout session.
  // items: [{localId, exerciseId, name, category, blockId}]
  // sets:  [{localId, itemLocalId, weight, reps}]  (order = insertion/chronological order)
  var session = null;
  var sessionMode = 'new'; // 'new' | 'edit'
  var selectMode = false;
  var selectedLocalIds = [];
  var entrySelection = {}; // blockId -> itemLocalId, sticky exercise choice for superset entry rows

  // ---------- Utilities ----------
  function $(id) { return document.getElementById(id); }
  function uid() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function showToast(msg, isError) {
    var t = $('toast');
    t.textContent = msg;
    t.className = isError ? 'error' : '';
    t.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.style.display = 'none'; }, 2600);
  }
  function distinctCategories() {
    return Array.from(new Set(exercisesCache.map(function (e) { return e.category; }).filter(Boolean))).sort();
  }

  // ---------- API ----------
  function apiGet(action, params) {
    if (!API_URL) return Promise.reject(new Error('No API URL configured. Open Settings.'));
    var url = API_URL + '?action=' + encodeURIComponent(action);
    for (var k in (params || {})) {
      url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }
    return fetch(url).then(function (r) { return r.json(); }).then(unwrap);
  }
  function apiPost(action, payload) {
    if (!API_URL) return Promise.reject(new Error('No API URL configured. Open Settings.'));
    var body = Object.assign({ action: action }, payload || {});
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(unwrap);
  }
  function unwrap(res) {
    if (!res || !res.ok) throw new Error((res && res.error) || 'Request failed');
    return res.data;
  }

  // ---------- Navigation ----------
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    $('screen-' + name).classList.add('active');
    document.querySelectorAll('.bottomnav button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.screen === name);
    });
    document.querySelectorAll('.bottomnav').forEach(function (n) { n.style.display = name === 'settings' ? 'none' : 'flex'; });

    if (name === 'library') loadLibrary();
    if (name === 'history') loadHistory();
  }

  document.querySelectorAll('.bottomnav button').forEach(function (b) {
    b.addEventListener('click', function () { showScreen(b.dataset.screen); });
  });

  $('settingsBtn').addEventListener('click', function () {
    $('apiUrlInput').value = API_URL;
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    $('screen-settings').classList.add('active');
    document.querySelectorAll('.bottomnav').forEach(function (n) { n.style.display = 'none'; });
  });

  $('saveApiUrlBtn').addEventListener('click', function () {
    var v = $('apiUrlInput').value.trim();
    if (!v) { showToast('Enter a URL first', true); return; }
    API_URL = v;
    localStorage.setItem('workoutlog.apiUrl', v);
    $('settingsStatus').textContent = 'Saved.';
    showToast('Web App URL saved');
    showScreen('library');
  });

  // ---------- Category select widget (shared: Add Exercise + Edit Exercise) ----------
  function categorySelectHtml(idPrefix, selected) {
    var cats = distinctCategories();
    if (selected && cats.indexOf(selected) === -1) cats.push(selected);
    var options = cats.map(function (c) {
      return '<option value="' + escapeHtml(c) + '"' + (c === selected ? ' selected' : '') + '>' + escapeHtml(c) + '</option>';
    }).join('');
    return '<label for="' + idPrefix + '-select">Category</label>' +
      '<select id="' + idPrefix + '-select">' +
        '<option value="">Uncategorized</option>' +
        options +
        '<option value="' + NEW_CATEGORY_VALUE + '">+ Add New Category</option>' +
      '</select>' +
      '<input type="text" id="' + idPrefix + '-new" placeholder="New category name" style="display:none; margin-top:8px;">';
  }
  function wireCategorySelect(idPrefix) {
    var sel = $(idPrefix + '-select');
    var newInput = $(idPrefix + '-new');
    sel.addEventListener('change', function () {
      newInput.style.display = sel.value === NEW_CATEGORY_VALUE ? 'block' : 'none';
      if (sel.value === NEW_CATEGORY_VALUE) newInput.focus();
    });
  }
  function readCategorySelect(idPrefix) {
    var sel = $(idPrefix + '-select');
    if (sel.value === NEW_CATEGORY_VALUE) {
      return $(idPrefix + '-new').value.trim();
    }
    return sel.value;
  }

  // ---------- Library ----------
  function loadLibrary() {
    apiGet('getExercises').then(function (data) {
      exercisesCache = data;
      populateCategoryFilter();
      renderLibraryList();
    }).catch(function (err) { showToast(err.message, true); });
  }

  function populateCategoryFilter() {
    var cats = distinctCategories();
    var sel = $('libraryCategoryFilter');
    var current = sel.value;
    sel.innerHTML = '<option value="">All categories</option>' +
      cats.map(function (c) { return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>'; }).join('');
    sel.value = current;
  }

  function renderLibraryList() {
    var q = $('librarySearch').value.trim().toLowerCase();
    var cat = $('libraryCategoryFilter').value;
    var list = exercisesCache.filter(function (e) {
      var matchesQ = !q || e.name.toLowerCase().indexOf(q) !== -1;
      var matchesCat = !cat || e.category === cat;
      return matchesQ && matchesCat;
    }).sort(function (a, b) { return a.name.localeCompare(b.name); });

    var el = $('libraryList');
    if (!list.length) {
      el.innerHTML = '<div class="empty-state">No exercises found.</div>';
      return;
    }
    el.innerHTML = '<div class="card">' + list.map(function (e) {
      return '<div class="exercise-row" data-id="' + escapeHtml(e.id) + '"><span class="name">' + escapeHtml(e.name) + '</span>' +
        '<span class="chip">' + escapeHtml(e.category || 'Uncategorized') + '</span></div>';
    }).join('') + '</div>';

    el.querySelectorAll('.exercise-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var ex = exercisesCache.find(function (e) { return e.id === row.dataset.id; });
        if (ex) openEditExerciseModal(ex);
      });
    });
  }

  $('librarySearch').addEventListener('input', renderLibraryList);
  $('libraryCategoryFilter').addEventListener('change', renderLibraryList);

  $('toggleAddExerciseBtn').addEventListener('click', function () {
    var f = $('addExerciseForm');
    var show = f.style.display === 'none';
    f.style.display = show ? 'block' : 'none';
    if (show) {
      $('newExCategoryField').innerHTML = categorySelectHtml('newEx', '');
      wireCategorySelect('newEx');
    }
  });

  $('submitNewExerciseBtn').addEventListener('click', function () {
    var name = $('newExName').value.trim();
    var category = readCategorySelect('newEx');
    if (!name) { showToast('Name is required', true); return; }
    apiPost('addExercise', { name: name, category: category }).then(function () {
      $('newExName').value = '';
      $('addExerciseForm').style.display = 'none';
      showToast('Exercise added');
      loadLibrary();
    }).catch(function (err) { showToast(err.message, true); });
  });

  function openEditExerciseModal(ex) {
    var body =
      '<div class="field"><label for="editExName">Name</label>' +
      '<input type="text" id="editExName" value="' + escapeHtml(ex.name) + '"></div>' +
      '<div class="field" id="editExCategoryField">' + categorySelectHtml('editEx', ex.category || '') + '</div>' +
      '<div class="modal-actions">' +
        '<button class="btn secondary" id="editExCancelBtn">Cancel</button>' +
        '<button class="btn" id="editExSaveBtn">Save</button>' +
      '</div>';
    var backdrop = showModal('Edit Exercise', body);
    wireCategorySelect('editEx');
    backdrop.querySelector('#editExCancelBtn').addEventListener('click', function () { closeModal(backdrop); });
    backdrop.querySelector('#editExSaveBtn').addEventListener('click', function () {
      var name = $('editExName').value.trim();
      var category = readCategorySelect('editEx');
      if (!name) { showToast('Name is required', true); return; }
      apiPost('updateExercise', { id: ex.id, name: name, category: category }).then(function () {
        closeModal(backdrop);
        showToast('Exercise updated');
        loadLibrary();
      }).catch(function (err) { showToast(err.message, true); });
    });
  }

  // ---------- Log Workout ----------
  function startNewSession() {
    session = { id: null, date: todayISO(), items: [], sets: [] };
    sessionMode = 'new';
    selectMode = false;
    selectedLocalIds = [];
    entrySelection = {};
    $('logHeading').textContent = 'Log Workout';
    $('saveWorkoutBtn').textContent = 'Save Workout';
    $('logStartView').style.display = 'none';
    $('logActiveView').style.display = 'block';
    $('sessionDateInput').value = session.date;
    $('sessionExerciseSearch').value = '';
    $('sessionSearchResults').innerHTML = '';
    renderSession();
    if (!exercisesCache.length) {
      apiGet('getExercises').then(function (data) { exercisesCache = data; }).catch(function () {});
    }
  }

  $('startWorkoutBtn').addEventListener('click', startNewSession);

  $('sessionDateInput').addEventListener('change', function () {
    if (session) session.date = this.value;
  });

  $('discardWorkoutBtn').addEventListener('click', function () {
    var msg = sessionMode === 'edit' ? 'Discard changes to this workout?' : 'Discard this workout? Nothing will be saved.';
    if (!confirm(msg)) return;
    var wasEdit = sessionMode === 'edit';
    session = null;
    $('logActiveView').style.display = 'none';
    $('logStartView').style.display = 'block';
    if (wasEdit) showScreen('history'); else showScreen('log');
  });

  $('sessionExerciseSearch').addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    var box = $('sessionSearchResults');
    if (!q) { box.innerHTML = ''; return; }
    var matches = exercisesCache.filter(function (e) { return e.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 20);
    if (!matches.length) { box.innerHTML = '<div class="muted" style="padding:8px 0;">No matches</div>'; return; }
    box.innerHTML = matches.map(function (e) {
      return '<div class="exercise-row" data-id="' + escapeHtml(e.id) + '">' +
        '<span class="name">' + escapeHtml(e.name) + '</span><span class="chip">' + escapeHtml(e.category || '') + '</span></div>';
    }).join('');
    box.querySelectorAll('.exercise-row').forEach(function (row) {
      row.addEventListener('click', function () {
        addExerciseToSession(row.dataset.id);
        $('sessionExerciseSearch').value = '';
        box.innerHTML = '';
      });
    });
  });

  function addExerciseToSession(exerciseId) {
    var ex = exercisesCache.find(function (e) { return e.id === exerciseId; });
    if (!ex) return;
    session.items.push({
      localId: uid(),
      exerciseId: ex.id,
      name: ex.name,
      category: ex.category,
      blockId: uid()
    });
    renderSession();
  }

  function removeExerciseFromSession(localId) {
    session.items = session.items.filter(function (i) { return i.localId !== localId; });
    session.sets = session.sets.filter(function (s) { return s.itemLocalId !== localId; });
    selectedLocalIds = selectedLocalIds.filter(function (id) { return id !== localId; });
    renderSession();
  }

  function toggleSelect(localId) {
    var idx = selectedLocalIds.indexOf(localId);
    if (idx === -1) selectedLocalIds.push(localId); else selectedLocalIds.splice(idx, 1);
    selectMode = selectedLocalIds.length > 0;
    renderSession();
  }

  $('linkSelectedBtn').addEventListener('click', function () {
    if (selectedLocalIds.length < 2) { showToast('Select at least 2 exercises', true); return; }
    var newBlockId = uid();
    session.items.forEach(function (item) {
      if (selectedLocalIds.indexOf(item.localId) !== -1) item.blockId = newBlockId;
    });
    selectedLocalIds = [];
    selectMode = false;
    renderSession();
    showToast('Linked as superset');
  });

  $('cancelSelectBtn').addEventListener('click', function () {
    selectedLocalIds = [];
    selectMode = false;
    renderSession();
  });

  function groupByBlock(items) {
    var order = [];
    var map = {};
    items.forEach(function (item) {
      if (!map[item.blockId]) { map[item.blockId] = []; order.push(item.blockId); }
      map[item.blockId].push(item);
    });
    return order.map(function (blockId) { return { blockId: blockId, items: map[blockId] }; });
  }

  function renderSession() {
    var el = $('sessionExerciseList');
    $('linkBar').style.display = selectMode ? 'block' : 'none';

    if (!session.items.length) {
      el.innerHTML = '<div class="empty-state">Search above to add exercises to this workout.</div>';
      return;
    }

    var blocks = groupByBlock(session.items);
    el.innerHTML = blocks.map(function (block) {
      var isSuperset = block.items.length > 1;
      var inner = renderBlockTable(block);
      if (isSuperset) {
        return '<div class="superset-block"><div class="superset-label">Superset</div>' + inner + '</div>';
      }
      return '<div class="block-card">' + inner + '</div>';
    }).join('');

    el.querySelectorAll('[data-action]').forEach(function (node) {
      node.addEventListener('click', function () {
        var action = node.dataset.action;
        var localId = node.dataset.local;
        if (action === 'select') toggleSelect(localId);
        else if (action === 'remove') removeExerciseFromSession(localId);
        else if (action === 'addset') addSet(node.dataset.block);
        else if (action === 'delset') deleteSet(node.dataset.setid);
      });
    });
    el.querySelectorAll('select.cell-exercise-select').forEach(function (sel) {
      sel.addEventListener('change', function () {
        entrySelection[sel.dataset.block] = sel.value;
      });
    });
    el.querySelectorAll('input.cell-num').forEach(function (input) {
      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); addSet(input.dataset.block); }
      });
    });
  }

  function renderBlockTable(block) {
    var isSuperset = block.items.length > 1;
    var checkboxes = block.items.map(function (item) {
      var checked = selectedLocalIds.indexOf(item.localId) !== -1;
      return '<span class="select-check ' + (checked ? 'checked' : '') + '" data-action="select" data-local="' + item.localId + '">' + (checked ? '✓' : '') + '</span>' +
        '<span class="name">' + escapeHtml(item.name) + '</span>' +
        '<button class="remove-x" data-action="remove" data-local="' + item.localId + '">✕</button>';
    }).join('<span class="muted" style="margin:0 4px;">+</span>');

    var rows = session.sets.filter(function (s) {
      return block.items.some(function (i) { return i.localId === s.itemLocalId; });
    });

    var rowsHtml = rows.map(function (s) {
      var item = block.items.find(function (i) { return i.localId === s.itemLocalId; }) || {};
      return '<div class="set-table-row">' +
        '<span class="cell-exercise">' + escapeHtml(item.name || '') + '</span>' +
        '<span class="cell-exercise" style="text-align:center;">' + escapeHtml(s.weight) + '</span>' +
        '<span class="cell-exercise" style="text-align:center;">' + escapeHtml(s.reps) + '</span>' +
        '<button class="del" data-action="delset" data-setid="' + s.localId + '">✕</button>' +
      '</div>';
    }).join('');

    var defaultItem = entrySelection[block.blockId] && block.items.some(function (i) { return i.localId === entrySelection[block.blockId]; })
      ? entrySelection[block.blockId] : block.items[0].localId;
    entrySelection[block.blockId] = defaultItem;

    var exerciseCell = isSuperset
      ? '<select class="cell-exercise-select" data-block="' + block.blockId + '">' +
          block.items.map(function (i) {
            return '<option value="' + i.localId + '"' + (i.localId === defaultItem ? ' selected' : '') + '>' + escapeHtml(i.name) + '</option>';
          }).join('') +
        '</select>'
      : '<span class="cell-exercise">' + escapeHtml(block.items[0].name) + '</span>';

    var entryRow = '<div class="set-table-row">' +
      exerciseCell +
      '<input type="number" inputmode="decimal" class="cell-num" placeholder="lbs" id="w-' + block.blockId + '" data-block="' + block.blockId + '">' +
      '<input type="number" inputmode="numeric" class="cell-num" placeholder="reps" id="r-' + block.blockId + '" data-block="' + block.blockId + '">' +
      '<button class="add-btn" data-action="addset" data-block="' + block.blockId + '">+</button>' +
    '</div>';

    return '<div class="block-card-head"><div class="titles">' + checkboxes + '</div></div>' +
      '<div class="set-table">' +
        '<div class="set-table-row head"><span>Exercise</span><span>Weight (lbs)</span><span>Reps</span><span></span></div>' +
        rowsHtml +
        entryRow +
      '</div>';
  }

  function addSet(blockId) {
    var wEl = $('w-' + blockId), rEl = $('r-' + blockId);
    var weight = parseFloat(wEl.value), reps = parseInt(rEl.value, 10);
    if (isNaN(weight) || isNaN(reps)) { showToast('Enter weight and reps', true); return; }
    var itemLocalId = entrySelection[blockId];
    session.sets.push({ localId: uid(), itemLocalId: itemLocalId, weight: weight, reps: reps });
    renderSession();
    var newW = $('w-' + blockId);
    if (newW) newW.focus();
  }

  function deleteSet(setLocalId) {
    session.sets = session.sets.filter(function (s) { return s.localId !== setLocalId; });
    renderSession();
  }

  function loadWorkoutIntoSession(workout) {
    session = { id: workout.id, date: workout.date, items: [], sets: [] };
    sessionMode = 'edit';
    selectMode = false;
    selectedLocalIds = [];
    entrySelection = {};

    var itemKeyMap = {};
    workout.sets.forEach(function (s) {
      var key = s.blockId + '|' + s.exerciseId;
      if (!itemKeyMap[key]) {
        var localId = uid();
        itemKeyMap[key] = localId;
        session.items.push({ localId: localId, exerciseId: s.exerciseId, name: s.exerciseName, category: s.exerciseCategory, blockId: s.blockId });
      }
      session.sets.push({ localId: uid(), itemLocalId: itemKeyMap[key], weight: s.weight, reps: s.reps });
    });

    $('logHeading').textContent = 'Edit Workout';
    $('saveWorkoutBtn').textContent = 'Save Changes';
    $('logStartView').style.display = 'none';
    $('logActiveView').style.display = 'block';
    $('sessionDateInput').value = session.date;
    $('sessionExerciseSearch').value = '';
    $('sessionSearchResults').innerHTML = '';
    renderSession();
    if (!exercisesCache.length) {
      apiGet('getExercises').then(function (data) { exercisesCache = data; }).catch(function () {});
    }
    showScreen('log');
  }

  $('saveWorkoutBtn').addEventListener('click', function () {
    if (!session || !session.items.length) { showToast('Add at least one exercise', true); return; }
    if (!session.date) { showToast('Pick a date', true); return; }
    if (!session.sets.length) { showToast('Log at least one set', true); return; }

    // Build payload per item (not per block) since a superset block can hold
    // sets for multiple different exerciseIds sharing the same blockId.
    var payloadItems = session.items.map(function (item) {
      return {
        exerciseId: item.exerciseId,
        blockId: item.blockId,
        sets: session.sets.filter(function (s) { return s.itemLocalId === item.localId; })
          .map(function (s) { return { weight: s.weight, reps: s.reps }; })
      };
    }).filter(function (i) { return i.sets.length > 0; });

    var action = sessionMode === 'edit' ? 'updateWorkout' : 'saveWorkout';
    var payload = sessionMode === 'edit'
      ? { id: session.id, date: session.date, items: payloadItems }
      : { date: session.date, items: payloadItems };

    $('saveWorkoutBtn').disabled = true;
    apiPost(action, payload).then(function () {
      showToast(sessionMode === 'edit' ? 'Workout updated' : 'Workout saved');
      session = null;
      $('logActiveView').style.display = 'none';
      $('logStartView').style.display = 'block';
      showScreen('history');
    }).catch(function (err) {
      showToast(err.message, true);
    }).finally(function () {
      $('saveWorkoutBtn').disabled = false;
    });
  });

  // ---------- History ----------
  function loadHistory() {
    var el = $('historyList');
    el.innerHTML = '<div class="muted">Loading...</div>';
    apiGet('getWorkouts').then(function (data) {
      if (!data.length) {
        el.innerHTML = '<div class="empty-state">No workouts logged yet.</div>';
        return;
      }
      el.innerHTML = data.map(function (w) {
        return '<div class="card" data-id="' + escapeHtml(w.id) + '" style="cursor:pointer;">' +
          '<div class="name" style="font-weight:700; margin-bottom:4px;">' + escapeHtml(w.date) + '</div>' +
          '<div class="muted">' + w.exerciseCount + ' exercise' + (w.exerciseCount === 1 ? '' : 's') +
          ' · ' + w.setCount + ' set' + (w.setCount === 1 ? '' : 's') + '</div>' +
        '</div>';
      }).join('');
      el.querySelectorAll('[data-id]').forEach(function (card) {
        card.addEventListener('click', function () { openWorkoutDetail(card.dataset.id); });
      });
    }).catch(function (err) {
      el.innerHTML = '<div class="empty-state">Failed to load: ' + escapeHtml(err.message) + '</div>';
    });
  }

  function openWorkoutDetail(id) {
    apiGet('getWorkout', { id: id }).then(function (w) {
      var blocks = groupSetsByBlock(w.sets);
      var body = blocks.map(function (block) {
        var isSuperset = block.exerciseGroups.length > 1;
        var inner = block.exerciseGroups.map(function (g) {
          var setsHtml = g.sets.map(function (s, idx) {
            return '<div class="set-table-row"><span>Set ' + (idx + 1) + '</span><span>' + escapeHtml(s.weight) + ' lbs</span><span>' + escapeHtml(s.reps) + ' reps</span><span></span></div>';
          }).join('');
          return '<div class="block-card"><div class="name">' + escapeHtml(g.exerciseName) +
            '</div><span class="chip">' + escapeHtml(g.exerciseCategory || '') + '</span>' +
            '<div class="set-table">' + setsHtml + '</div></div>';
        }).join('');
        if (isSuperset) return '<div class="superset-block"><div class="superset-label">Superset</div>' + inner + '</div>';
        return inner;
      }).join('') || '<div class="empty-state">No sets recorded.</div>';

      body += '<div class="modal-actions">' +
        '<button class="btn secondary" id="detailEditBtn">Edit</button>' +
        '<button class="btn danger" id="detailDeleteBtn">Delete</button>' +
      '</div>';

      var backdrop = showModal('Workout — ' + w.date, body);
      backdrop.querySelector('#detailEditBtn').addEventListener('click', function () {
        closeModal(backdrop);
        loadWorkoutIntoSession(w);
      });
      backdrop.querySelector('#detailDeleteBtn').addEventListener('click', function () {
        closeModal(backdrop);
        confirmDeleteWorkout(w.id);
      });
    }).catch(function (err) { showToast(err.message, true); });
  }

  function confirmDeleteWorkout(id) {
    var body = '<p>Are you sure you want to erase this workout?</p>' +
      '<div class="modal-actions">' +
        '<button class="btn secondary" id="confirmNoBtn">No</button>' +
        '<button class="btn danger" id="confirmDeleteBtn">Delete</button>' +
      '</div>';
    var backdrop = showModal('Delete Workout', body, true);
    backdrop.querySelector('#confirmNoBtn').addEventListener('click', function () { closeModal(backdrop); });
    backdrop.querySelector('#confirmDeleteBtn').addEventListener('click', function () {
      apiPost('deleteWorkout', { id: id }).then(function () {
        closeModal(backdrop);
        showToast('Workout deleted');
        loadHistory();
      }).catch(function (err) { showToast(err.message, true); });
    });
  }

  function groupSetsByBlock(sets) {
    var blockOrder = [], blockMap = {};
    sets.forEach(function (s) {
      if (!blockMap[s.blockId]) { blockMap[s.blockId] = { blockId: s.blockId, exOrder: [], exMap: {} }; blockOrder.push(s.blockId); }
      var b = blockMap[s.blockId];
      if (!b.exMap[s.exerciseId]) {
        b.exMap[s.exerciseId] = { exerciseName: s.exerciseName, exerciseCategory: s.exerciseCategory, sets: [] };
        b.exOrder.push(s.exerciseId);
      }
      b.exMap[s.exerciseId].sets.push({ weight: s.weight, reps: s.reps });
    });
    return blockOrder.map(function (blockId) {
      var b = blockMap[blockId];
      return { blockId: blockId, exerciseGroups: b.exOrder.map(function (exId) { return b.exMap[exId]; }) };
    });
  }

  // ---------- Modal helpers ----------
  function showModal(title, bodyHtml, centered) {
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop' + (centered ? ' center' : '');
    backdrop.innerHTML = '<div class="modal-sheet">' +
      '<div class="modal-sheet-head"><h3>' + escapeHtml(title) + '</h3><button class="icon-btn" id="closeModalBtn">Close</button></div>' +
      bodyHtml + '</div>';
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeModal(backdrop); });
    backdrop.querySelector('#closeModalBtn').addEventListener('click', function () { closeModal(backdrop); });
    return backdrop;
  }
  function closeModal(backdrop) {
    if (backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
  }

  // ---------- Init ----------
  function init() {
    if (!API_URL) {
      $('settingsBtn').click();
      $('settingsStatus').textContent = 'Enter your Web App URL to get started.';
    } else {
      showScreen('library');
    }
  }

  init();
})();
</script>

</body>
</html>

<style>
  :root {
    --bg: #08090a;
    --card: #1c1d21;
    --card-soft: #232428;
    --card-border: #2c2e33;
    --text: #f4f5f7;
    --text-dim: #9aa0ab;
    --accent: #2f6fee;
    --accent-ink: #ffffff;
    --accent-soft: #16294f;
    --superset-bg: #b9d4ff;
    --superset-ink: #10254a;
    --danger: #ff5c5c;
    --danger-ink: #ffffff;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
  }
  body { padding-bottom: 86px; }
  h1, h2, h3 { margin: 0 0 8px; }
  header.topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; background: var(--bg);
  }
  header.topbar h1 { font-size: 21px; display: flex; align-items: center; gap: 10px; margin: 0; }
  .brand-wordmark { height: 40px; width: auto; display: block; }

  .splash-screen {
    position: fixed; inset: 0; z-index: 100; background: #03060d;
    transition: opacity 0.5s ease;
  }
  .splash-screen.hide { opacity: 0; pointer-events: none; }
  .splash-img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }

  /* Library sub-tabs: Exercises / Workouts / Programs */
  .lib-subnav {
    display: flex; background: var(--card-soft); border-radius: var(--radius-pill);
    padding: 4px; margin-bottom: 16px; gap: 4px;
  }
  .lib-subnav-btn {
    flex: 1; text-align: center; padding: 10px 4px; border: none; background: none;
    color: var(--text-dim); font-weight: 700; font-size: 14px; border-radius: var(--radius-pill); cursor: pointer;
  }
  .lib-subnav-btn.active { background: var(--accent); color: var(--accent-ink); }
  .lib-tab-panel.swipe-anim { animation: libTabIn 0.18s ease; }
  @keyframes libTabIn { from { opacity: 0.3; } to { opacity: 1; } }

  .active-badge {
    display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: var(--radius-pill);
    background: rgba(63,179,127,0.18); color: var(--ok, #3fb37f); text-transform: uppercase; letter-spacing: 0.03em;
  }
  .schedule-row {
    display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; padding: 6px 0;
  }
  .schedule-row .day-label { font-size: 13px; font-weight: 700; color: var(--text-dim); }

  .log-summary-btn {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    text-align: left; background: var(--card-soft); border: none; border-radius: var(--radius-md);
    padding: 12px 14px; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
    margin-bottom: 14px;
  }
  .log-summary-btn::after { content: '✏️ Edit'; color: var(--accent); font-size: 12px; font-weight: 700; }
  .tmpl-pick-row {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 4px;
    border-bottom: 1px solid var(--card-border); cursor: pointer;
  }
  .tmpl-pick-row:last-child { border-bottom: none; }
  .tmpl-pick-row.selected { background: var(--card-soft); border-radius: var(--radius-md); }
  .cell-num.needs-weight { border-color: var(--accent); background: rgba(47,111,238,0.08); }
  .icon-btn {
    background: var(--card-soft); border: none; color: var(--text);
    border-radius: var(--radius-pill); width: 40px; height: 40px; font-size: 17px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .screen { display: none; }
  .screen.active { display: block; }

  input, select, button, textarea {
    font-family: inherit; font-size: 16px;
  }
  input[type=text], input[type=number], input[type=date], select {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-md);
    border: 1px solid var(--card-border); background: #17181b; color: var(--text);
  }
  input::placeholder { color: var(--text-dim); }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  button.btn {
    display: inline-block; padding: 13px 20px; border-radius: var(--radius-pill); border: none;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;
    min-height: 46px;
  }
  button.btn.secondary { background: var(--card-soft); color: var(--text); }
  button.btn.danger { background: var(--danger); color: var(--danger-ink); }
  button.btn.block { width: 100%; }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
  button.btn-sm {
    padding: 7px 14px; border-radius: var(--radius-pill); border: none; background: var(--card-soft);
    color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; min-height: 32px;
  }
  button.btn-sm.danger { background: rgba(255,92,92,0.16); color: var(--danger); }
  button.btn-sm.active { background: var(--accent); color: var(--accent-ink); }

  .card {
    background: var(--card); border-radius: var(--radius-lg);
    padding: 16px; margin-bottom: 12px;
  }
  .muted { color: var(--text-dim); font-size: 14px; }
  .chip {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-pill);
    background: #d7dbe2; color: #20232a;
  }
  .chip-equipment { background: #cfe0ff; color: #163a73; }
  .chip-flag { background: #ffd6d6; color: #7a1414; }
  .exercise-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 4px; border-bottom: 1px solid var(--card-border);
    cursor: pointer;
  }
  .exercise-row:last-child { border-bottom: none; }
  .exercise-row:active { background: var(--card-soft); border-radius: var(--radius-md); }
  .exercise-row .name { font-weight: 600; }

  nav.bottomnav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; background: var(--bg); border-top: 1px solid var(--card-border);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); gap: 6px;
  }
  nav.bottomnav button {
    flex: 1; background: none; border: none; color: var(--text-dim);
    padding: 8px 4px; font-size: 12px; font-weight: 700; border-radius: var(--radius-pill); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav.bottomnav .nav-icon {
    display: inline-block; width: 22px; height: 22px;
    background-color: #025df7;
    mask-repeat: no-repeat; mask-position: center; mask-size: contain;

  nav.bottomnav button.active { color: var(--accent-ink); background: var(--accent); }
  nav.bottomnav button.active .nav-icon { background-color: var(--accent-ink); }

  .superset-block {
    border-radius: var(--radius-lg);
    padding: 14px; margin-bottom: 14px; background: var(--superset-bg); color: var(--superset-ink);
  }
  .superset-label {
    font-size: 12px; font-weight: 800; color: var(--superset-ink); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 8px;
  }
  .superset-block .muted { color: rgba(16,37,74,0.65); }
  .superset-block .set-table-row { border-bottom-color: rgba(16,37,74,0.15); }
  .superset-block .set-table-row.head { color: rgba(16,37,74,0.65); border-bottom-color: rgba(16,37,74,0.25); }
  .superset-block select.cell-exercise-select { background: rgba(255,255,255,0.6); color: var(--superset-ink); border-color: rgba(16,37,74,0.2); }
  .superset-block input.cell-num { background: rgba(255,255,255,0.6); color: var(--superset-ink); border-color: rgba(16,37,74,0.2); }
  .superset-block .remove-x { color: rgba(16,37,74,0.55); }
  .block-card { padding: 14px 0; border-top: 1px solid var(--card-border); }
  .block-card:first-child { padding-top: 0; border-top: none; }
  .superset-block .block-card { padding: 0; border-top: none; }
  .block-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .block-card-head .titles { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .select-check {
    width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--card-border);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    color: transparent; font-size: 14px; flex-shrink: 0;
  }
  .select-check.checked { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .remove-x { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 2px 6px; }

  /* Spreadsheet-style set table */
  .set-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .set-table-row {
    display: grid; grid-template-columns: 1fr 66px 54px 30px; gap: 8px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--card-border);
  }
  .set-table-row.head {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); font-weight: 700;
    border-bottom: 1px solid var(--card-border); padding-bottom: 8px;
  }
  .set-table-row:last-child { border-bottom: none; }
  .set-table-row .cell-exercise { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-table-row select.cell-exercise-select { padding: 6px 4px; font-size: 13px; border-radius: 10px; }
  .set-table-row input.cell-num {
    padding: 8px 4px; text-align: center; width: 100%; border-radius: 10px;
  }
  .set-table-row .del {
    color: var(--danger); background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px;
  }
  .set-table-row .add-btn {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: var(--radius-pill);
    width: 28px; height: 28px; font-size: 16px; font-weight: 800; line-height: 1; cursor: pointer;
  }
  .superset-block .set-table-row .add-btn { background: var(--superset-ink); color: var(--superset-bg); }
  .set-table-row .add-btn:disabled { opacity: 0.35; }
  .set-table-row input.cell-num.prefilled { color: var(--text-dim); }
  .add-set-row-btn {
    display: block; width: 100%; margin-top: 8px; padding: 10px; border-radius: var(--radius-md);
    background: transparent; color: var(--accent); font-weight: 700; font-size: 14px;
    border: 1.5px dashed var(--accent); cursor: pointer; text-align: center;
  }
  .superset-block .add-set-row-btn { color: var(--superset-ink); border-color: var(--superset-ink); }

  /* Advanced set logging: mode select, badges, drop/side sub-rows, advanced panel */
  .mode-select {
    font-size: 11px; padding: 3px 6px; border-radius: 8px; margin-left: 2px;
    background: var(--card-soft); color: var(--text-dim); border: 1px solid var(--card-border);
  }
  .set-badges { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
  .set-badge {
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 8px;
    background: var(--card-soft); color: var(--text-dim); white-space: nowrap;
  }
  .set-badge.failure { background: var(--danger); color: var(--danger-ink); }
  .set-badge.tempo { background: var(--card-soft); color: var(--text); border: 1px solid var(--card-border); }
  .set-table-row.sub .cell-exercise { padding-left: 16px; color: var(--text-dim); font-size: 13px; }
  .edit-toggle {
    background: none; border: none; color: var(--text-dim); font-size: 14px; cursor: pointer; padding: 4px;
  }
  .advanced-toggle {
    background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 700;
    cursor: pointer; padding: 4px 0; text-align: left;
  }
  .superset-block .advanced-toggle { color: var(--superset-ink); }
  .advanced-panel {
    background: var(--card-soft); border-radius: var(--radius-md); padding: 10px; margin: 4px 0 10px;
  }
  .field-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .advanced-panel .tempo-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .tempo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .tempo-field label { font-size: 10px; color: var(--text-dim); display: block; margin-bottom: 2px; }
  .tempo-field input { width: 100%; padding: 6px 4px; text-align: center; border-radius: 8px; }
  .add-drop-btn {
    background: none; border: 1.5px dashed var(--text-dim); color: var(--text-dim); border-radius: var(--radius-md);
    font-size: 12px; font-weight: 700; padding: 6px; width: 100%; cursor: pointer; margin-top: 2px;
  }
  .superset-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .unlink-btn {
    background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 700;
    text-decoration: underline; cursor: pointer; padding: 2px;
  }

  /* Superset = an outlined group holding one blue box per round ("Set 1", "Set 2", ...) */
  .superset-group { border: 1.5px solid var(--superset-bg); border-radius: var(--radius-lg); padding: 10px; margin-bottom: 14px; }
  .superset-group .superset-label-row .superset-label { color: var(--text); margin-bottom: 0; }
  .superset-head { margin-bottom: 10px; }
  .ss-item { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .ss-item .name { flex: 1 1 auto; font-weight: 600; min-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ss-item .mode-select { width: auto; flex: 0 0 auto; }
  .superset-group .superset-block { margin-bottom: 0; }
  .superset-group .set-swipe { margin-bottom: 10px; border-radius: var(--radius-lg); }
  .superset-block > .superset-label { margin-bottom: 6px; }
  .superset-actions { display: flex; gap: 8px; }
  .superset-actions .add-set-row-btn { flex: 1; width: auto; margin-top: 0; }

  /* Per-set checkbox (done) and swipe-left-to-delete */
  .set-check { width: 22px; height: 22px; margin: 0 auto; accent-color: var(--accent); cursor: pointer; }
  .superset-block .set-check { accent-color: var(--superset-ink); }
  .set-table-row.done input.cell-num { border-color: #34c759; }
  .set-swipe { position: relative; overflow: hidden; touch-action: pan-y; }
  .set-swipe-content { position: relative; transition: transform 0.18s ease; }
  .set-swipe.dragging { user-select: none; -webkit-user-select: none; }
  .set-swipe.dragging .set-swipe-content { transition: none; }
  .set-swipe-action {
    position: absolute; top: 0; bottom: 0; right: 0; width: 104px; border: none;
    background: var(--danger); color: var(--danger-ink); font-size: 14px; font-weight: 700;
    cursor: pointer; opacity: 0; pointer-events: none;
  }
  .set-swipe.open .set-swipe-action, .set-swipe.dragging .set-swipe-action { opacity: 1; pointer-events: auto; }
  .set-swipe.open .set-swipe-content { transform: translateX(-104px); }

  /* History calendar: today = filled circle, workout day = square outline, selection = soft band */
  .cal { padding: 12px; margin-bottom: 14px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-weight: 700; font-size: 16px; }
  .cal-nav {
    background: var(--card-soft); color: var(--text); border: none; width: 36px; height: 36px;
    border-radius: 50%; font-size: 20px; line-height: 1; cursor: pointer;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-dim); padding: 4px 0; text-transform: uppercase; }
  .cal-day {
    height: 44px; padding: 0; border: none; background: none; color: var(--text);
    font: inherit; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .cal-day.blank { pointer-events: none; }
  .cal-box { width: 36px; height: 36px; border: 2px solid transparent; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .cal-day.has-workout .cal-box { border-color: var(--accent); }
  .cal-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .cal-day.is-today .cal-num { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .cal-day.sel { background: var(--accent-soft); font-weight: 700; }
  .cal-day.sel-single { border-radius: 12px; }
  .cal-day.sel-start { border-radius: 12px 0 0 12px; }
  .cal-day.sel-end { border-radius: 0 12px 12px 0; }
  .cal-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .cal-foot .cal-actions { display: flex; gap: 6px; }
  .cal-filter-label { font-size: 13px; color: var(--text-dim); margin: 2px 2px 8px; }

  /* Bodyweight history: summary tiles + entry rows */
  .bw-summary { display: flex; gap: 10px; margin-bottom: 12px; }
  .bw-stat { flex: 1; background: var(--card); border-radius: var(--radius-md); padding: 10px 14px; }
  .bw-stat .k { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
  .bw-stat .v { font-size: 18px; font-weight: 700; }
  .bw-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bw-weight { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .bw-weight .muted { font-size: 13px; font-weight: 400; }

  .search-results { max-height: 260px; overflow-y: auto; margin-top: 8px; }
  .search-results .exercise-row { cursor: pointer; }
  .search-results .exercise-row:active { background: var(--card-soft); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }

  .records-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    color: var(--text-dim); margin-bottom: 8px;
  }
  .record-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid var(--card-border); font-size: 14px;
  }
  .record-row:last-child { border-bottom: none; }
  .record-row .rep-label { color: var(--text-dim); }
  .record-row .rep-weight { font-weight: 700; }
  .record-row.is-1rm .rep-label { color: var(--accent); font-weight: 700; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 20;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.center { align-items: center; padding: 20px; }
  .modal-sheet {
    background: var(--card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px 18px 26px;
    width: 100%; max-width: 640px; max-height: 82vh; overflow-y: auto;
  }
  .modal-backdrop.center .modal-sheet { border-radius: var(--radius-lg); max-height: 90vh; }
  .modal-sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions > * { flex: 1; }

  #toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--card-soft); color: var(--text); padding: 11px 18px; border-radius: var(--radius-pill);
    font-size: 14px; font-weight: 600; z-index: 30; display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  #toast.error { background: var(--danger); color: var(--danger-ink); }

  /* Equipment / Muscles tag pickers */
  .tag-pill-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .tag-pill {
    display: inline-flex; align-items: center; padding: 7px 14px; border-radius: var(--radius-pill);
    background: var(--card-soft); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1.5px solid transparent; user-select: none;
  }
  .tag-pill.checked { background: var(--accent); color: var(--accent-ink); }
  .muscle-order-hint { font-size: 12px; color: var(--text-dim); margin: 10px 0 6px; }
  .muscle-order-list { display: flex; flex-direction: column; gap: 6px; }
  .muscle-order-row {
    display: flex; align-items: center; gap: 8px; background: var(--card-soft);
    border-radius: var(--radius-md); padding: 8px 10px;
  }
  .muscle-order-row.dragging { opacity: 0.5; }
  .muscle-order-row .drag-handle {
    cursor: grab; touch-action: none; font-size: 18px; color: var(--text-dim);
    padding: 6px; line-height: 1;
  }
  .muscle-order-row .muscle-order-label { flex: 1; font-size: 14px; }
  .muscle-order-row .muscle-order-label b { color: var(--accent); }

  /* Bodyweight +/- sign toggle in Log screen entry rows */
  .weight-with-sign { display: flex; align-items: center; justify-content: center; gap: 3px; }
  .weight-with-sign input.cell-num { min-width: 0; }
  .sign-toggle {
    flex-shrink: 0; width: 22px; height: 28px; border-radius: 8px; border: none;
    font-size: 15px; font-weight: 800; cursor: pointer; line-height: 1;
  }
  .sign-toggle.pos { background: var(--accent); color: var(--accent-ink); }
  .sign-toggle.neg { background: var(--danger); color: var(--danger-ink); }

  /* Account: avatar, drawer, edit-account modal */
  .avatar {
    border-radius: var(--radius-pill); background-color: var(--accent-soft); color: var(--text);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    background-size: cover; background-position: center; flex-shrink: 0; overflow: hidden;
  }
  .avatar-btn {
    width: 40px; height: 40px; font-size: 17px; border: none; cursor: pointer;
    border-radius: var(--radius-pill); background-color: var(--accent-soft); color: var(--text);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    background-size: cover; background-position: center;
  }
  .avatar-lg { width: 52px; height: 52px; font-size: 20px; }
  .avatar-xl { width: 84px; height: 84px; font-size: 30px; }

  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 22;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .drawer-panel {
    width: 100%; max-width: 640px; background: var(--card);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg); padding: 20px 18px;
    transform: translateY(-100%); transition: transform 0.22s ease;
  }
  .drawer-panel.open { transform: translateY(0); }
  .drawer-profile-row { display: flex; align-items: center; gap: 14px; }
  .drawer-profile-name { font-size: 17px; font-weight: 700; }
  .drawer-weight { margin-top: 16px; padding: 0 2px; font-size: 15px; font-weight: 600; }
  .drawer-weight .muted { font-weight: 400; margin-left: 6px; }
  .drawer-item {
    display: block; width: 100%; text-align: left; margin-top: 14px; padding: 14px;
    background: var(--card-soft); color: var(--text); border: none; border-radius: var(--radius-md);
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
</style>
</head>

<!-- ACCOUNT DRAWER -->
<div class="drawer-backdrop" id="accountDrawerBackdrop" style="display:none;">
  <div class="drawer-panel" id="accountDrawer">
    <div class="drawer-profile-row">
      <div class="avatar avatar-lg" id="drawerAvatar"></div>
      <div class="drawer-profile-name" id="drawerName">Your Name</div>
    </div>
    <div class="drawer-weight" id="drawerWeight"></div>
    <button class="drawer-item" id="editAccountBtn">Edit Account</button>

<main>

  <!-- LIBRARY SCREEN -->
  <section class="screen" id="screen-library">
    <h2>Library</h2>

    <div class="lib-subnav" id="librarySubnav">
      <button class="lib-subnav-btn active" data-libtab="exercises">Exercises</button>
      <button class="lib-subnav-btn" data-libtab="workouts">Workouts</button>
      <button class="lib-subnav-btn" data-libtab="programs">Programs</button>
    </div>

    <!-- EXERCISES SUB-TAB -->
    <div class="lib-tab-panel active" id="libTabExercises">
      <div class="field">
        <input type="text" id="librarySearch" placeholder="Search exercises...">
      </div>
      <div class="field">
        <label class="muted" style="display:block; margin-bottom:6px;">Filter by</label>
        <div class="tag-pill-grid" id="filterTypeChips"></div>
      </div>
      <div class="field" id="libraryFilterValueRow" style="display:none;"></div>
      <button class="btn secondary block" id="toggleAddExerciseBtn" style="margin-bottom:14px;">+ Add Exercise</button>

      <div class="card" id="addExerciseForm" style="display:none;">
        <div class="field">
          <label for="newExName">Name</label>
          <input type="text" id="newExName" placeholder="e.g. Barbell Squat">
        </div>
        <div class="field" id="newExEquipmentField"></div>
        <div class="field" id="newExCategoryField"></div>
        <div class="field" id="newExMusclesField"></div>
        <label class="field-row"><input type="checkbox" id="newExUnilateral"> Unilateral (single-side exercise)</label>
        <button class="btn block" id="submitNewExerciseBtn">Save Exercise</button>
      </div>

      <p class="muted" style="margin-bottom:6px;">Tap an exercise to edit it.</p>
      <div id="libraryList"></div>
    </div>

    <!-- WORKOUTS SUB-TAB (reusable templates — not logged sessions, those live in History) -->
    <div class="lib-tab-panel" id="libTabWorkouts" style="display:none;">
      <div class="field">
        <input type="text" id="workoutTemplateSearch" placeholder="Search workouts...">
      </div>
      <button class="btn secondary block" id="toggleCreateWorkoutBtn" style="margin-bottom:14px;">+ Create Workout</button>

      <div class="card" id="createWorkoutForm" style="display:none;"></div>

      <p class="muted" style="margin-bottom:6px;">Tap a workout to view or edit it.</p>
      <div id="workoutTemplateList"></div>
    </div>

    <!-- PROGRAMS SUB-TAB -->
    <div class="lib-tab-panel" id="libTabPrograms" style="display:none;">
      <h3 style="margin-top:0;">Your Programs</h3>
      <button class="btn secondary block" id="toggleCreateProgramBtn" style="margin-bottom:14px;">+ Create Program</button>

      <div class="card" id="createProgramForm" style="display:none;"></div>

      <p class="muted" style="margin-bottom:6px;">Tap a program to view or edit it.</p>
      <div id="programList"></div>
    </div>
  </section>

  <!-- LOG WORKOUT SCREEN -->
  <section class="screen" id="screen-log">
    <div id="logStartView">
      <h2>Log Workout</h2>
      <p class="muted">Start a new session to begin adding exercises and sets.</p>
      <button class="btn block" id="startWorkoutBtn">Log Workout</button>
      <button class="btn secondary block" id="logBodyweightBtn" style="margin-top:10px;">Log Body Weight</button>
    </div>

    <!-- Date/name (and optionally: pick a saved workout to pre-fill) before entering the logging screen -->
    <div id="logSetupView" style="display:none;">
      <h2 id="logSetupHeading">Log Workout</h2>

      <div class="field">
        <label for="logSetupDateInput">Date</label>
        <input type="date" id="logSetupDateInput">
      </div>

      <div class="field">
        <label for="logSetupNameInput">Workout Name</label>
        <input type="text" id="logSetupNameInput" placeholder="Workout">
      </div>

      <div class="field" id="logSetupTemplateSection">
        <label class="muted" style="display:block; margin-bottom:6px;">Or start from a saved workout</label>
        <div id="logSetupTemplateList"></div>
      </div>

      <div class="row">
        <button class="btn secondary" id="logSetupCancelBtn">Cancel</button>
        <button class="btn" id="logSetupConfirmBtn">Start Workout</button>
      </div>
    </div>

    <div id="logActiveView" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h2 id="logHeading">Log Workout</h2>
        <button class="btn-sm danger" id="discardWorkoutBtn">Discard</button>
      </div>

      <button type="button" class="log-summary-btn" id="logActiveSummaryBtn"></button>

      <div id="sessionExerciseList"></div>

      <div class="field" style="margin-top:16px;">
        <label for="sessionExerciseSearch">Add an exercise</label>
        <input type="text" id="sessionExerciseSearch" placeholder="Search exercises to add...">
        <div class="search-results" id="sessionSearchResults"></div>
        <div id="quickAddForm" style="display:none; margin-top:8px;"></div>
      </div>

      <button class="btn block" id="saveWorkoutBtn" style="margin-top:8px;">Save Workout</button>
    </div>
  </section>

  <!-- HISTORY SCREEN -->
  <section class="screen" id="screen-history">
    <h2>History</h2>
    <div class="lib-subnav" id="historySubnav">
      <button class="lib-subnav-btn active" data-histtab="workout">Workout</button>
      <button class="lib-subnav-btn" data-histtab="bodyweight">Body Weight</button>
    </div>
    <div id="historyCalendar"></div>
    <div id="historyCards"></div>
  </section>

</main>

</nav>

<script>
(function () {
  'use strict';

  var NEW_CATEGORY_VALUE = '__new__';

  // ---------- State ----------
  if (!window.WorkoutAPI || window.WorkoutAPI.loadError) {
    var loadErrMsg = (window.WorkoutAPI && window.WorkoutAPI.loadError) ||
      'Could not load supabase-api.js. Make sure it sits next to index.html.';
    document.body.innerHTML = '<div style="padding:24px;font:15px system-ui;">' + loadErrMsg + '</div>';
    throw new Error(loadErrMsg);
  }
  var exercisesCache = [];

  // Active in-progress (or being-edited) workout session.
  // items: [{localId, exerciseId, name, category, blockId}]
  // sets:  [{localId, itemLocalId, mode, weight, reps, right, toFailure, tempo, dropSegments, sign, done, prefilled}]
  //   done: the set's checkbox — only checked (done) sets are saved
  //   prefilled: numbers were copied from the previous set and haven't been touched yet (shown grey)
  //   sign: 1 | -1, Bodyweight only — added weight vs. assisted (weight is stored signed)
  //   A superset "round" is the Nth set of each exercise in the group (no separate field needed).
  //   mode: 'bilateral' (default/ordinary) | 'both' (one entry, means both sides) | 'independent' (left/right logged separately)
  //   weight/reps: the set's values for 'bilateral'/'both'; the LEFT side's values for 'independent'
  //   right: {weight, reps} — only present when mode is 'independent'
  //   tempo: null (inherit exercise default) or {eccentric, bottomPause, concentric, topPause}
  //   dropSegments: [{weight, reps}, ...] performed after the primary effort
  var session = null;
  var sessionMode = 'new'; // 'new' | 'edit'
  var itemMode = {}; // itemLocalId -> 'bilateral' | 'both' | 'independent', what new sets for that exercise use
  var expandedSetPanels = {}; // setLocalId -> true, whether an already-logged set's Failure/Tempo panel is open
  var supersetBuilder = null; // { originItemLocalId, pending: [{exerciseId,name,category,equipment}] } while the "Add to Superset" modal is open

  // ---------- Utilities ----------
  function $(id) { return document.getElementById(id); }
  function uid() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function showToast(msg, isError) {
    var t = $('toast');
    t.textContent = msg;
    t.className = isError ? 'error' : '';
    t.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.style.display = 'none'; }, 2600);
  }
  function distinctCategories() {
    return Array.from(new Set(exercisesCache.map(function (e) { return e.category; }).filter(Boolean))).sort();
  }

  function chipHtml(category) {
    return '<span class="chip">' + escapeHtml(category || 'Uncategorized') + '</span>';
  }
  function equipmentChipHtml(equipment) {
    return equipment ? '<span class="chip chip-equipment">' + escapeHtml(equipment) + '</span>' : '';
  }

  // Simple edit-distance check to catch near-duplicate exercise names
  // (typos, or the same name with different capitalization).
  function levenshtein(a, b) {
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var dp = [];
    for (var i = 0; i <= m; i++) dp.push([i]);
    for (var j = 0; j <= n; j++) dp[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        var cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      }
    }
    return dp[m][n];
  }
  function findSimilarExercises(name, excludeId) {
    var a = name.trim().toLowerCase();
    return exercisesCache.filter(function (e) {
      if (excludeId && e.id === excludeId) return false;
      var b = e.name.trim().toLowerCase();
      return a === b || levenshtein(a, b) <= 2;
    });
  }
  // Runs saveFn() directly if no near-duplicates exist; otherwise shows a
  // warning with the close matches and lets the user Discard / Keep Editing / Save Anyway.
  function saveExerciseWithDupCheck(name, excludeId, saveFn, discardFn) {
    var matches = findSimilarExercises(name, excludeId);

    var listHtml = matches.map(function (m) {

      '<div class="card" style="padding:2px 12px;">' + listHtml + '</div>' +

        '<button class="btn secondary" id="dupKeepBtn">Keep Editing</button>' +
      '</div>' +
      '<button class="btn block" id="dupSaveAnywayBtn" style="margin-top:10px;">Save Anyway</button>';
    var backdrop = showModal('This exercise may already exist', body, true);

    backdrop.querySelector('#dupKeepBtn').addEventListener('click', function () { closeModal(backdrop); });

  // Downscales an uploaded image client-side before storing it (keeps localStorage lean).
  function resizeImageFile(file, maxDim, callback) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- Generic single-select-with-"add new" widget ----------

  function tagSelectHtml(idPrefix, fieldKey, options, selected, emptyLabel, labelText) {
    if (selected && options.indexOf(selected) === -1) options = options.concat([selected]);
    var opts = options.map(function (o) {

  }
  function wireTagSelect(idPrefix, fieldKey) {
    var sel = $(idPrefix + '-' + fieldKey + '-select');
    var newInput = $(idPrefix + '-' + fieldKey + '-new');
    sel.addEventListener('change', function () {

  // ---------- Muscles picker: multi-select chips + drag-to-reorder (top = primary) ----------
  var BASE_MUSCLES = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Forearms', 'Quads', 'Hamstrings', 'Glutes', 'Calves', 'Core', 'Lats', 'Traps'];
  function distinctMuscleOptions() {
    var used = [];
    exercisesCache.forEach(function (e) { (e.muscles || []).forEach(function (m) { used.push(m); }); });
    return Array.from(new Set(BASE_MUSCLES.concat(used)));
  }
  // Renders into #<idPrefix>-muscles-editor (container must already exist in the DOM).
  // Returns { getSelected() } so the caller can read the final ordered list on submit.
  function createMuscleEditor(idPrefix, initialMuscles) {
    var containerId = idPrefix + '-muscles-editor';
    var selected = (initialMuscles || []).slice();
    var extraOptions = [];

    function allOptions() {
      return Array.from(new Set(distinctMuscleOptions().concat(extraOptions).concat(selected)));
    }

    function wireDragReorder() {
      var listEl = $(idPrefix + '-muscle-order-list');
      if (!listEl) return;
      listEl.querySelectorAll('.drag-handle').forEach(function (handle) {
        handle.addEventListener('pointerdown', function (ev) {
          ev.preventDefault();
          var row = handle.closest('.muscle-order-row');
          row.classList.add('dragging');
          var moving = true;

          function rows() { return Array.from(listEl.querySelectorAll('.muscle-order-row')); }
          function onMove(moveEv) {
            if (!moving) return;
            var y = moveEv.clientY;
            var siblings = rows().filter(function (r) { return r !== row; });
            for (var i = 0; i < siblings.length; i++) {
              var rect = siblings[i].getBoundingClientRect();
              var mid = rect.top + rect.height / 2;
              if (y < mid) { listEl.insertBefore(row, siblings[i]); return; }
            }
            listEl.appendChild(row);
          }
          function onUp() {
            moving = false;
            row.classList.remove('dragging');
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
            selected = rows().map(function (r) { return r.dataset.muscle; });
            render();
          }
          document.addEventListener('pointermove', onMove);
          document.addEventListener('pointerup', onUp);
        });
      });
    }

    function render() {
      var container = $(containerId);
      if (!container) return;
      var chipsHtml = allOptions().map(function (m) {
        var checked = selected.indexOf(m) !== -1;
        return '<span class="tag-pill ' + (checked ? 'checked' : '') + '" data-muscle="' + escapeHtml(m) + '">' + escapeHtml(m) + '</span>';
      }).join('');
      var orderHtml = selected.length
        ? selected.map(function (m, idx) {
            return '<div class="muscle-order-row" data-muscle="' + escapeHtml(m) + '">' +
              '<span class="drag-handle">⠿</span>' +
              '<span class="muscle-order-label">' + (idx === 0 ? '<b>Primary:</b> ' : '') + escapeHtml(m) + '</span>' +
              '<button type="button" class="remove-x" data-remove-muscle="' + escapeHtml(m) + '">✕</button>' +
            '</div>';
          }).join('')
        : '<p class="muted" style="margin:4px 0;">No muscles selected.</p>';

      container.innerHTML =
        '<label>Muscles Worked</label>' +
        '<div class="tag-pill-grid">' + chipsHtml + '</div>' +
        '<div class="row" style="margin-top:8px;">' +
          '<input type="text" id="' + idPrefix + '-muscle-new" placeholder="Add new muscle">' +
          '<button type="button" class="btn-sm" id="' + idPrefix + '-muscle-add-btn" style="flex:0 0 auto;">Add</button>' +
        '</div>' +
        (selected.length > 1 ? '<div class="muscle-order-hint">Drag ⠿ to reorder — top is the primary muscle.</div>' : '') +
        '<div class="muscle-order-list" id="' + idPrefix + '-muscle-order-list">' + orderHtml + '</div>';

      container.querySelectorAll('.tag-pill').forEach(function (chip) {
        chip.addEventListener('click', function () {
          var m = chip.dataset.muscle;
          var idx = selected.indexOf(m);
          if (idx === -1) selected.push(m); else selected.splice(idx, 1);
          render();
        });
      });
      container.querySelectorAll('[data-remove-muscle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var m = btn.dataset.removeMuscle;
          selected = selected.filter(function (x) { return x !== m; });
          render();
        });
      });
      var addBtn = $(idPrefix + '-muscle-add-btn');
      if (addBtn) addBtn.addEventListener('click', function () {
        var input = $(idPrefix + '-muscle-new');
        var val = input.value.trim();
        if (!val) return;
        if (extraOptions.indexOf(val) === -1 && distinctMuscleOptions().indexOf(val) === -1) extraOptions.push(val);
        if (selected.indexOf(val) === -1) selected.push(val);
        render();
      });
      wireDragReorder();
    }

    render();
    return { getSelected: function () { return selected.slice(); } };
  }

  function isExerciseIncomplete(e) {

  function renderLibraryList() {
    var q = $('librarySearch').value.trim().toLowerCase();
    var list = exercisesCache.filter(function (e) {
      var matchesQ = !q || e.name.toLowerCase().indexOf(q) !== -1;
      var matchesFilter = true;
      if (libraryFilterType && libraryFilterValue) {
        if (libraryFilterType === 'equipment') matchesFilter = e.equipment === libraryFilterValue;
        else if (libraryFilterType === 'category') matchesFilter = e.category === libraryFilterValue;
        else matchesFilter = (e.muscles && e.muscles[0]) === libraryFilterValue;
      }
      return matchesQ && matchesFilter;
    }).sort(function (a, b) { return a.name.localeCompare(b.name); });

    var el = $('libraryList');

      el.innerHTML = '<div class="empty-state">No exercises found.</div>';

      if (section) section.innerHTML = '<div class="records-title">Rep Records</div><p class="muted" style="margin:0;">Couldn\'t load records: ' + escapeHtml(err.message) + '</p>';
      // Records failed to load, so we can't confirm it's safe to delete — don't offer the button.
      renderDeleteSection(backdrop, ex, false);
    });
    backdrop.querySelector('#editExCancelBtn').addEventListener('click', function () { closeModal(backdrop); });
    backdrop.querySelector('#editExSaveBtn').addEventListener('click', function () {
      var name = $('editExName').value.trim();
      var category = readCategorySelect('editEx');
      var equipment = readEquipmentSelect('editEx');
      var muscles = editExMuscleEditor.getSelected();
      var unilateral = $('editExUnilateral').checked;

      function doSave() {
        apiPost('updateExercise', { id: ex.id, name: name, category: category, equipment: equipment, muscles: muscles, unilateral: unilateral }).then(function () {
          closeModal(backdrop);
          showToast('Exercise updated');
          loadLibrary();
        }).catch(function (err) { showToast(err.message, true); });

  // ---------- Library sub-tabs: Exercises / Workouts / Programs ----------
  var LIB_TABS = ['exercises', 'workouts', 'programs'];
  var currentLibTab = 'exercises';

  function switchLibTab(tab) {
    currentLibTab = tab;
    document.querySelectorAll('#librarySubnav .lib-subnav-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.libtab === tab); });
    document.querySelectorAll('.lib-tab-panel').forEach(function (p) { p.style.display = 'none'; p.classList.remove('swipe-anim'); });
    var panel = $('libTab' + tab.charAt(0).toUpperCase() + tab.slice(1));
    panel.style.display = 'block';
    panel.classList.add('swipe-anim');
    if (tab === 'exercises') loadLibrary();
    else if (tab === 'workouts') loadWorkoutTemplates();
    else if (tab === 'programs') loadPrograms();
  }

  document.querySelectorAll('#librarySubnav .lib-subnav-btn').forEach(function (b) {
    b.addEventListener('click', function () { switchLibTab(b.dataset.libtab); });
  });

  // Long swipe left/right on the Library screen also switches sub-tabs.
  (function () {
    var startX = 0, startY = 0, tracking = false;
    var libSection = $('screen-library');
    libSection.addEventListener('pointerdown', function (ev) {
      startX = ev.clientX; startY = ev.clientY; tracking = true;
    });
    libSection.addEventListener('pointerup', function (ev) {
      if (!tracking) return;
      tracking = false;
      var dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      var idx = LIB_TABS.indexOf(currentLibTab);
      if (dx < 0 && idx < LIB_TABS.length - 1) switchLibTab(LIB_TABS[idx + 1]);
      else if (dx > 0 && idx > 0) switchLibTab(LIB_TABS[idx - 1]);
    });
  })();

  // ---------- Workouts (Library sub-tab): reusable templates, not logged sessions ----------
  var workoutTemplatesCache = [];
  var workoutBuilderInstance = null;

  function loadWorkoutTemplates() {
    apiGet('getWorkoutTemplates').then(function (data) {
      workoutTemplatesCache = data;
      renderWorkoutTemplateList();
    }).catch(function (err) { showToast(err.message, true); });
  }

  function estimateWorkoutDuration_(totalSets) {
    return Math.round(totalSets * 3); // rough heuristic: ~3 min per set (incl. rest), used only when no manual estimate is set
  }

  function renderWorkoutTemplateList() {
    var q = $('workoutTemplateSearch').value.trim().toLowerCase();
    var list = workoutTemplatesCache.filter(function (w) {
      return !q || w.name.toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return a.name.localeCompare(b.name); });

    var el = $('workoutTemplateList');
    if (!list.length) { el.innerHTML = '<div class="empty-state">No workouts yet.</div>'; return; }
    el.innerHTML = '<div class="card">' + list.map(function (w) {
      var dur = w.durationMinutes || estimateWorkoutDuration_(w.totalSets);
      return '<div class="exercise-row" data-id="' + escapeHtml(w.id) + '">' +
        '<span class="name">' + escapeHtml(w.name) + '</span>' +
        '<span class="muted" style="text-align:right;">' + w.exerciseCount + ' exercise' + (w.exerciseCount === 1 ? '' : 's') + ' · ~' + dur + ' min</span>' +
      '</div>';
    }).join('') + '</div>';

    el.querySelectorAll('.exercise-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var w = workoutTemplatesCache.find(function (x) { return x.id === row.dataset.id; });
        if (!w) return;
        try {
          openWorkoutTemplateDetail(w);
        } catch (err) {
          showToast('Could not open this workout: ' + err.message, true);
        }
      });
    });
  }
  $('workoutTemplateSearch').addEventListener('input', renderWorkoutTemplateList);

  // Small self-contained "which exercises + sets/reps" builder, shared by create and edit.
  // Same look/feel as logging a workout: each exercise lists its sets one after another,
  // reps only (no weight — this is a template, not a performed session).
  // Workout tags: same chip-multiselect-with-"add new" interaction as the exercise
  // muscle picker, minus the drag-to-reorder/primary concept (doesn't apply to plain tags).
  var BASE_WORKOUT_TAGS = ['Push', 'Pull', 'Legs', 'Upper Body', 'Lower Body', 'Full Body'];
  function distinctWorkoutTagOptions() {
    var used = [];
    workoutTemplatesCache.forEach(function (t) { (t.tags || []).forEach(function (tag) { used.push(tag); }); });
    return Array.from(new Set(BASE_WORKOUT_TAGS.concat(used)));
  }
  function createWorkoutTagPicker(containerId, initialTags) {
    var selected = (initialTags || []).slice();
    var extraOptions = [];

    function allOptions() {
      return Array.from(new Set(distinctWorkoutTagOptions().concat(extraOptions).concat(selected)));
    }

    function render() {
      var container = $(containerId);
      if (!container) return;
      var chipsHtml = allOptions().map(function (tag) {
        var checked = selected.indexOf(tag) !== -1;
        return '<span class="tag-pill ' + (checked ? 'checked' : '') + '" data-tag="' + escapeHtml(tag) + '">' + escapeHtml(tag) + '</span>';
      }).join('');
      container.innerHTML =
        '<div class="tag-pill-grid">' + chipsHtml + '</div>' +
        '<div class="row" style="margin-top:8px;">' +
          '<input type="text" id="' + containerId + '-new" placeholder="Add new tag">' +
          '<button type="button" class="btn-sm" id="' + containerId + '-add-btn" style="flex:0 0 auto;">Add</button>' +
        '</div>';

      container.querySelectorAll('.tag-pill').forEach(function (chip) {
        chip.addEventListener('click', function () {
          var tag = chip.dataset.tag;
          var idx = selected.indexOf(tag);
          if (idx === -1) selected.push(tag); else selected.splice(idx, 1);
          render();
        });
      });
      $(containerId + '-add-btn').addEventListener('click', function () {
        var input = $(containerId + '-new');
        var val = input.value.trim();
        if (!val) return;
        if (extraOptions.indexOf(val) === -1 && distinctWorkoutTagOptions().indexOf(val) === -1) extraOptions.push(val);
        if (selected.indexOf(val) === -1) selected.push(val);
        render();
      });
    }

    render();
    return { getSelected: function () { return selected.slice(); } };
  }

  function createWorkoutBuilder(idPrefix, initialItems) {
    var items = (initialItems || []).map(function (it) {
      return { exerciseId: it.exerciseId, name: it.name, setsReps: (it.setsReps || []).slice() };
    });
    var pendingReps = {}; // exIdx -> current (uncommitted) reps entry value, persisted across re-renders

    function addSetToExercise(exIdx) {
      var input = document.getElementById(idPrefix + '-wb-entry-' + exIdx);
      var v = input ? parseInt(input.value, 10) : NaN;
      if (isNaN(v)) { showToast('Enter reps', true); return; }
      items[exIdx].setsReps.push(v);
      delete pendingReps[exIdx];
      render();
      var newInput = document.getElementById(idPrefix + '-wb-entry-' + exIdx);
      if (newInput) newInput.focus();
    }

    function render() {
      var container = $(idPrefix + '-wb-list');
      if (!container) return;
      if (!items.length) {
        container.innerHTML = '<p class="muted" style="margin:8px 0;">No exercises added yet.</p>';
        return;
      }
      container.innerHTML = items.map(function (it, exIdx) {
        var setsHtml = it.setsReps.map(function (reps, setIdx) {
          return '<div class="set-table-row">' +
            '<span class="cell-exercise">Set ' + (setIdx + 1) + '</span>' +
            '<input type="number" inputmode="numeric" class="cell-num" value="' + escapeHtml(reps) + '" data-wb-edit-ex="' + exIdx + '" data-wb-edit-set="' + setIdx + '">' +
            '<span></span>' +
            '<button class="del" data-wb-del-ex="' + exIdx + '" data-wb-del-set="' + setIdx + '">✕</button>' +
          '</div>';
        }).join('');
        var entryVal = pendingReps[exIdx] !== undefined ? pendingReps[exIdx] : '';
        var entryRow = '<div class="set-table-row">' +
          '<span class="cell-exercise">Set ' + (it.setsReps.length + 1) + '</span>' +
          '<input type="number" inputmode="numeric" class="cell-num entry-num" placeholder="reps" id="' + idPrefix + '-wb-entry-' + exIdx + '" data-wb-entry-ex="' + exIdx + '" value="' + escapeHtml(entryVal) + '">' +
          '<span></span><span></span>' +
        '</div>' +
        '<button type="button" class="add-set-row-btn" data-wb-add-ex="' + exIdx + '">+ Add Set</button>';

        return '<div class="card" style="margin-bottom:10px; padding:12px;">' +
          '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">' +
            '<span class="name">' + escapeHtml(it.name) + '</span>' +
            '<button class="remove-x" data-wb-remove-ex="' + exIdx + '">✕</button>' +
          '</div>' +
          '<div class="set-table-row head"><span>Set</span><span>Reps</span><span></span><span></span></div>' +
          setsHtml + entryRow +
        '</div>';
      }).join('');

      container.querySelectorAll('[data-wb-edit-ex]').forEach(function (input) {
        input.addEventListener('change', function () {
          var v = parseInt(input.value, 10);
          if (!isNaN(v)) items[Number(input.dataset.wbEditEx)].setsReps[Number(input.dataset.wbEditSet)] = v;
        });
        input.addEventListener('focus', function () { input.select(); });
      });
      container.querySelectorAll('[data-wb-del-ex]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          items[Number(btn.dataset.wbDelEx)].setsReps.splice(Number(btn.dataset.wbDelSet), 1);
          render();
        });
      });
      container.querySelectorAll('[data-wb-remove-ex]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          items.splice(Number(btn.dataset.wbRemoveEx), 1);
          pendingReps = {}; // exercise indices shift on removal; simplest to just drop any in-progress entries
          render();
        });
      });
      container.querySelectorAll('[data-wb-entry-ex]').forEach(function (input) {
        input.addEventListener('input', function () { pendingReps[input.dataset.wbEntryEx] = input.value; });
        input.addEventListener('focus', function () { input.select(); });
        input.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') { ev.preventDefault(); addSetToExercise(Number(input.dataset.wbEntryEx)); }
        });
      });
      container.querySelectorAll('[data-wb-add-ex]').forEach(function (btn) {
        btn.addEventListener('click', function () { addSetToExercise(Number(btn.dataset.wbAddEx)); });
      });
    }

    render();
    return {
      addExercise: function (exerciseId) {
        var ex = exercisesCache.find(function (e) { return e.id === exerciseId; });
        if (!ex) return;
        items.push({ exerciseId: ex.id, name: ex.name, setsReps: [] });
        render();
      },
      // Sweeps any typed-but-unconfirmed reps entries too, same rule as logging a workout:
      // whatever's visible gets saved, you don't have to tap "+ Add Set" first.
      getItems: function () {
        items.forEach(function (it, exIdx) {
          var val = pendingReps[exIdx];
          if (val !== undefined && val !== '') {
            var n = parseInt(val, 10);
            if (!isNaN(n)) it.setsReps.push(n);
          }
        });
        pendingReps = {};
        return items.map(function (it) { return { exerciseId: it.exerciseId, name: it.name, setsReps: it.setsReps.slice() }; });
      }
    };
  }

  $('toggleCreateWorkoutBtn').addEventListener('click', function () {
    var f = $('createWorkoutForm');
    var show = f.style.display === 'none' || !f.innerHTML;

  function renderWorkoutTemplateForm(existing) {

    f.innerHTML =
      '<div class="field"><label for="wtName">Name</label>' +

      '<div class="field"><label for="wtDuration">Estimated Duration (minutes, optional)</label>' +
      '<input type="number" id="wtDuration" placeholder="e.g. 55" value="' + (existing && existing.durationMinutes ? existing.durationMinutes : '') + '"></div>' +
      '<div class="field"><label>Tags</label><div id="wt-tags-picker"></div></div>' +
      '<div class="field">' +
        '<label for="wtExerciseSearch">Add exercises</label>' +
        '<input type="text" id="wtExerciseSearch" placeholder="Search exercises...">' +
        '<div class="search-results" id="wtExerciseSearchResults"></div>' +
      '</div>' +
      '<div id="wt-wb-list"></div>' +
      '<div class="modal-actions" style="margin-top:12px;">' +

    var workoutTagPickerInstance = createWorkoutTagPicker('wt-tags-picker', existing ? existing.tags : []);

    if (!exercisesCache.length) {
      apiGet('getExercises').then(function (data) { exercisesCache = data; }).catch(function () {});
    }

    $('wtExerciseSearch').addEventListener('input', function () {
      var q = this.value.trim().toLowerCase();
      var box = $('wtExerciseSearchResults');
      if (!q) { box.innerHTML = ''; return; }
      var matches = exercisesCache.filter(function (e) { return e.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 20);
      box.innerHTML = matches.length
        ? matches.map(function (e) {
            return '<div class="exercise-row" data-id="' + escapeHtml(e.id) + '"><span class="name">' + escapeHtml(e.name) + '</span>' + equipmentChipHtml(e.equipment) + '</div>';
          }).join('')
        : '<div class="muted" style="padding:8px 0;">No matches</div>';
      box.querySelectorAll('.exercise-row[data-id]').forEach(function (row) {
        row.addEventListener('click', function () {
          workoutBuilderInstance.addExercise(row.dataset.id);
          $('wtExerciseSearch').value = '';
          box.innerHTML = '';
        });
      });
    });

    $('wtCancelBtn').addEventListener('click', function () { f.style.display = 'none'; f.innerHTML = ''; });
    $('wtSaveBtn').addEventListener('click', function () {
      var name = $('wtName').value.trim();
      var duration = $('wtDuration').value ? Number($('wtDuration').value) : null;
      var items = workoutBuilderInstance.getItems();
      if (!name) { showToast('Name is required', true); return; }

      var payload = {
        name: name,
        exercises: items.map(function (it) { return { exerciseId: it.exerciseId, setsReps: it.setsReps }; }),
        durationMinutes: duration,
        tags: workoutTagPickerInstance.getSelected()
      };
      var action = existing ? 'updateWorkoutTemplate' : 'addWorkoutTemplate';
      if (existing) payload.id = existing.id;

      apiPost(action, payload).then(function () {
        f.style.display = 'none'; f.innerHTML = '';
        showToast(existing ? 'Workout updated' : 'Workout created');
        loadWorkoutTemplates();
      }).catch(function (err) { showToast(err.message, true); });
    });
  }

  function openWorkoutTemplateDetail(w) {
    var dur = w.durationMinutes || estimateWorkoutDuration_(w.totalSets || 0);
    var tagsHtml = (w.tags || []).length
      ? '<div class="tag-pill-grid" style="margin-bottom:10px;">' + w.tags.map(function (t) {

        }).join('') + '</div>'
      : '';
    var body = '<p class="muted">' + (w.exerciseCount || 0) + ' exercise' + (w.exerciseCount === 1 ? '' : 's') + ' · ~' + dur + ' min</p>' +
      tagsHtml +
      (w.exercises || []).map(function (it) {
        var setsReps = it.setsReps || [];
        var setsHtml = setsReps.length
          ? setsReps.map(function (reps, idx) {
              return '<div class="set-table-row"><span>Set ' + (idx + 1) + '</span><span>' + escapeHtml(reps) + ' reps</span><span></span><span></span></div>';
            }).join('')
          : '<p class="muted" style="margin:4px 0;">No sets prescribed.</p>';
        return '<div class="block-card"><div class="name">' + escapeHtml(it.name) + '</div>' +
          '<div class="set-table">' + setsHtml + '</div></div>';
      }).join('') +
      '<div class="modal-actions">' +
        '<button class="btn secondary" id="wtDetailEditBtn">Edit</button>' +
        '<button class="btn danger" id="wtDetailDeleteBtn">Delete</button>' +

    var backdrop = showModal(w.name, body, true);
    backdrop.querySelector('#wtDetailEditBtn').addEventListener('click', function () {
      closeModal(backdrop);
      renderWorkoutTemplateForm(w);
    });
    backdrop.querySelector('#wtDetailDeleteBtn').addEventListener('click', function () {
      var confirmBody = '<p>Delete "' + escapeHtml(w.name) + '"? This can\'t be undone.</p>' +
        '<div class="modal-actions">' +
          '<button class="btn secondary" id="wtDelNoBtn">Cancel</button>' +
          '<button class="btn danger" id="wtDelYesBtn">Delete</button>' +
        '</div>';
      var confirmBackdrop = showModal('Delete Workout', confirmBody, true);
      confirmBackdrop.querySelector('#wtDelNoBtn').addEventListener('click', function () { closeModal(confirmBackdrop); });
      confirmBackdrop.querySelector('#wtDelYesBtn').addEventListener('click', function () {
        apiPost('deleteWorkoutTemplate', { id: w.id }).then(function () {
          closeModal(confirmBackdrop);
          closeModal(backdrop);
          showToast('Workout deleted');
          loadWorkoutTemplates();
        }).catch(function (err) { showToast(err.message, true); });

  // ---------- Programs (Library sub-tab): Workout templates arranged on a weekly schedule ----------
  var SCHEDULE_DAYS_CLIENT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var programsCache = [];

  function ensureWorkoutTemplatesLoaded() {
    if (workoutTemplatesCache.length) return Promise.resolve();
    return apiGet('getWorkoutTemplates').then(function (data) { workoutTemplatesCache = data; });
  }

  function loadPrograms() {
    apiGet('getPrograms').then(function (data) {
      programsCache = data;
      renderProgramList();
    }).catch(function (err) { showToast(err.message, true); });
  }

  function renderProgramList() {
    var list = programsCache.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    var el = $('programList');
    if (!list.length) { el.innerHTML = '<div class="empty-state">No programs yet.</div>'; return; }
    el.innerHTML = '<div class="card">' + list.map(function (p) {

      return '<div class="exercise-row" data-id="' + escapeHtml(p.id) + '" style="align-items:flex-start;">' +
        '<div><div class="name">' + escapeHtml(p.name) + '</div>' +
        '<div class="muted">' + p.workoutCount + ' workout' + (p.workoutCount === 1 ? '' : 's') + ' · ' + durLabel + '</div></div>' +
        (p.active ? '<span class="active-badge">Active</span>' : '') +
      '</div>';
    }).join('') + '</div>';

    el.querySelectorAll('.exercise-row').forEach(function (row) {
      row.addEventListener('click', function () {

  $('toggleCreateProgramBtn').addEventListener('click', function () {
    var f = $('createProgramForm');
    var show = f.style.display === 'none' || !f.innerHTML;

      ensureWorkoutTemplatesLoaded().then(function () { renderProgramForm(null); f.style.display = 'block'; });

  function renderProgramForm(existing) {
    var f = $('createProgramForm');
    f.style.display = 'block';
    var scheduleMap = {};
    if (existing) existing.schedule.forEach(function (s) { scheduleMap[s.day] = s.workoutId; });

    var dayRows = SCHEDULE_DAYS_CLIENT.map(function (day) {
      var options = '<option value="">Rest</option>' + workoutTemplatesCache.map(function (w) {
        return '<option value="' + escapeHtml(w.id) + '"' + (scheduleMap[day] === w.id ? ' selected' : '') + '>' + escapeHtml(w.name) + '</option>';
      }).join('');
      return '<div class="schedule-row"><span class="day-label">' + day + '</span><select data-day="' + day + '">' + options + '</select></div>';
    }).join('');

    f.innerHTML =
      '<div class="field"><label for="pgName">Name</label>' +
      '<input type="text" id="pgName" placeholder="e.g. 4-Day Upper/Lower" value="' + (existing ? escapeHtml(existing.name) : '') + '"></div>' +
      '<div class="field"><label for="pgDuration">Duration (weeks)</label>' +
      '<input type="number" id="pgDuration" placeholder="e.g. 8" value="' + (existing && existing.durationWeeks ? existing.durationWeeks : '') + '"></div>' +
      '<div class="field"><label>Weekly Schedule</label>' + dayRows + '</div>' +
      '<div class="field" style="display:flex; align-items:center; gap:8px;">' +
        '<input type="checkbox" id="pgActive" style="width:auto;"' + (existing && existing.active ? ' checked' : '') + '>' +
        '<label for="pgActive" style="margin:0;">Set as active program</label>' +
      '</div>' +
      '<div class="modal-actions">' +
        '<button class="btn secondary" id="pgCancelBtn">Cancel</button>' +
        '<button class="btn" id="pgSaveBtn">' + (existing ? 'Save Changes' : 'Create Program') + '</button>' +
      '</div>';

    $('pgCancelBtn').addEventListener('click', function () { f.style.display = 'none'; f.innerHTML = ''; });
    $('pgSaveBtn').addEventListener('click', function () {
      var name = $('pgName').value.trim();
      var duration = $('pgDuration').value ? Number($('pgDuration').value) : null;
      var active = $('pgActive').checked;
      if (!name) { showToast('Name is required', true); return; }

      var schedule = Array.from(f.querySelectorAll('select[data-day]')).map(function (sel) {
        return { day: sel.dataset.day, workoutId: sel.value };
      });
      var payload = { name: name, durationWeeks: duration, schedule: schedule, active: active };
      var action = existing ? 'updateProgram' : 'addProgram';
      if (existing) payload.id = existing.id;

      apiPost(action, payload).then(function () {
        f.style.display = 'none'; f.innerHTML = '';
        showToast(existing ? 'Program updated' : 'Program created');
        loadPrograms();
      }).catch(function (err) { showToast(err.message, true); });
    });

  // ---------- Log Workout ----------
  var logSetupCallback = null;
  var logSetupCancelHandler = null;

  var workoutTemplatesLoaded = false;

  function ensureWorkoutTemplatesLoadedForSetup() {

  function startNewSessionFromSetup(date, name, templateId) {
    session = { id: null, date: date, name: name, items: [], sets: [] };
    sessionMode = 'new';
    itemMode = {};
    expandedSetPanels = {};

    function proceed() {
      if (templateId) {
        var tmpl = workoutTemplatesCache.find(function (t) { return t.id === templateId; });
        if (tmpl) populateSessionFromTemplate(tmpl);
      }
      showLogActiveView();
    }

    if (!exercisesCache.length) {
      apiGet('getExercises').then(function (data) { exercisesCache = data; }).catch(function () {}).then(proceed);
    } else {
      proceed();
    }
  }

  // Seeds the session from a saved template: same exercises, prescribed reps per set,
  // weight left blank to fill in as each set is actually performed. This never writes
  // back to the template — it only shapes this one local session.
  function populateSessionFromTemplate(tmpl) {
    tmpl.exercises.forEach(function (texc) {
      var localId = uid();
      var blockId = uid();
      var known = exercisesCache.find(function (e) { return e.id === texc.exerciseId; });
      session.items.push({
        localId: localId,
        exerciseId: texc.exerciseId,
        name: texc.name || (known && known.name) || 'Unknown exercise',
        category: known ? known.category : '',
        equipment: known ? (known.equipment || '') : '',
        blockId: blockId
      });
      if (known && known.unilateral) itemMode[localId] = 'both';
      var seedItem = session.items[session.items.length - 1];
      (texc.setsReps || []).forEach(function (reps) {
        var seeded = newSetFor(seedItem, null);
        seeded.reps = reps; // prescribed reps; weight is filled in as each set is performed
        session.sets.push(seeded);
      });
      if (!(texc.setsReps || []).length) session.sets.push(newSetFor(seedItem, null));
    });
  }

  function addExerciseToSession(exerciseId) {
    var ex = exercisesCache.find(function (e) { return e.id === exerciseId; });
    if (!ex) return;

    var newItem = {
      localId: localId,

      equipment: ex.equipment || '',
      blockId: uid()
    };
    session.items.push(newItem);
    if (ex.unilateral) itemMode[localId] = 'both';
    session.sets.push(newSetFor(newItem, null)); // every exercise starts with one blank set to fill in
    renderSession();

  function removeExerciseFromSession(localId) {
    session.items = session.items.filter(function (i) { return i.localId !== localId; });

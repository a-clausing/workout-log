<style>
  :root {
    --bg: #08090a;
    --card: #1c1d21;
    --card-soft: #232428;
    --card-border: #2c2e33;
    --text: #f4f5f7;
    --text-dim: #9aa0ab;
    --accent: #2f6fee;
    --accent-ink: #ffffff;
    --accent-soft: #16294f;
    --superset-bg: #b9d4ff;
    --superset-ink: #10254a;
    --danger: #ff5c5c;
    --danger-ink: #ffffff;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
  }
  body { padding-bottom: 86px; }
  h1, h2, h3 { margin: 0 0 8px; }
  header.topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; background: var(--bg);
  }
  header.topbar h1 { font-size: 21px; display: flex; align-items: center; gap: 10px; margin: 0; }
  .brand-wordmark { height: 26px; width: auto; display: block; }
  .icon-btn {
    background: var(--card-soft); border: none; color: var(--text);
    border-radius: var(--radius-pill); width: 40px; height: 40px; font-size: 17px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .screen { display: none; }
  .screen.active { display: block; }

  input, select, button, textarea {
    font-family: inherit; font-size: 16px;
  }
  input[type=text], input[type=number], input[type=date], select {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-md);
    border: 1px solid var(--card-border); background: #17181b; color: var(--text);
  }
  input::placeholder { color: var(--text-dim); }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  button.btn {
    display: inline-block; padding: 13px 20px; border-radius: var(--radius-pill); border: none;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;
    min-height: 46px;
  }
  button.btn.secondary { background: var(--card-soft); color: var(--text); }
  button.btn.danger { background: var(--danger); color: var(--danger-ink); }
  button.btn.block { width: 100%; }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
  button.btn-sm {
    padding: 7px 14px; border-radius: var(--radius-pill); border: none; background: var(--card-soft);
    color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; min-height: 32px;
  }
  button.btn-sm.danger { background: rgba(255,92,92,0.16); color: var(--danger); }
  button.btn-sm.active { background: var(--accent); color: var(--accent-ink); }

  .card {
    background: var(--card); border-radius: var(--radius-lg);
    padding: 16px; margin-bottom: 12px;
  }
  .muted { color: var(--text-dim); font-size: 14px; }
  .chip {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-pill);
    background: #d7dbe2; color: #20232a;
  }
  .exercise-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 4px; border-bottom: 1px solid var(--card-border);
    cursor: pointer;
  }
  .exercise-row:last-child { border-bottom: none; }
  .exercise-row:active { background: var(--card-soft); border-radius: var(--radius-md); }
  .exercise-row .name { font-weight: 600; }

  nav.bottomnav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; background: var(--bg); border-top: 1px solid var(--card-border);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); gap: 6px;
  }
  nav.bottomnav button {
    flex: 1; background: none; border: none; color: var(--text-dim);
    padding: 8px 4px; font-size: 12px; font-weight: 700; border-radius: var(--radius-pill); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav.bottomnav .nav-icon {
    display: inline-block; width: 22px; height: 22px;
    background-color: #025df7;
    mask-repeat: no-repeat; mask-position: center; mask-size: contain;
    -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; -webkit-mask-size: contain;

  nav.bottomnav button.active { color: var(--accent-ink); background: var(--accent); }
  nav.bottomnav button.active .nav-icon { background-color: var(--accent-ink); }

  .superset-block {
    border-radius: var(--radius-lg);
    padding: 14px; margin-bottom: 14px; background: var(--superset-bg); color: var(--superset-ink);
  }
  .superset-label {
    font-size: 12px; font-weight: 800; color: var(--superset-ink); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 8px;
  }
  .superset-block .muted { color: rgba(16,37,74,0.65); }
  .superset-block .set-table-row { border-bottom-color: rgba(16,37,74,0.15); }
  .superset-block .set-table-row.head { color: rgba(16,37,74,0.65); border-bottom-color: rgba(16,37,74,0.25); }
  .superset-block select.cell-exercise-select { background: rgba(255,255,255,0.6); color: var(--superset-ink); border-color: rgba(16,37,74,0.2); }
  .superset-block input.cell-num { background: rgba(255,255,255,0.6); color: var(--superset-ink); border-color: rgba(16,37,74,0.2); }
  .superset-block .remove-x { color: rgba(16,37,74,0.55); }
  .block-card { padding: 14px 0; border-top: 1px solid var(--card-border); }
  .block-card:first-child { padding-top: 0; border-top: none; }
  .superset-block .block-card { padding: 0; border-top: none; }
  .block-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .block-card-head .titles { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .select-check {
    width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--card-border);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    color: transparent; font-size: 14px; flex-shrink: 0;
  }
  .select-check.checked { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .remove-x { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 2px 6px; }

  /* Spreadsheet-style set table */
  .set-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .set-table-row {
    display: grid; grid-template-columns: 1fr 66px 54px 30px; gap: 8px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--card-border);
  }
  .set-table-row.head {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); font-weight: 700;
    border-bottom: 1px solid var(--card-border); padding-bottom: 8px;
  }
  .set-table-row:last-child { border-bottom: none; }
  .set-table-row .cell-exercise { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set-table-row select.cell-exercise-select { padding: 6px 4px; font-size: 13px; border-radius: 10px; }
  .set-table-row input.cell-num {
    padding: 8px 4px; text-align: center; width: 100%; border-radius: 10px;
  }
  .set-table-row .del {
    color: var(--danger); background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px;
  }
  .set-table-row .add-btn {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: var(--radius-pill);
    width: 28px; height: 28px; font-size: 16px; font-weight: 800; line-height: 1; cursor: pointer;
  }
  .superset-block .set-table-row .add-btn { background: var(--superset-ink); color: var(--superset-bg); }
  .set-table-row .add-btn:disabled { opacity: 0.35; }

  .search-results { max-height: 260px; overflow-y: auto; margin-top: 8px; }
  .search-results .exercise-row { cursor: pointer; }
  .search-results .exercise-row:active { background: var(--card-soft); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }

  .records-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    color: var(--text-dim); margin-bottom: 8px;
  }
  .record-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid var(--card-border); font-size: 14px;
  }
  .record-row:last-child { border-bottom: none; }
  .record-row .rep-label { color: var(--text-dim); }
  .record-row .rep-weight { font-weight: 700; }
  .record-row.is-1rm .rep-label { color: var(--accent); font-weight: 700; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 20;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.center { align-items: center; padding: 20px; }
  .modal-sheet {
    background: var(--card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px 18px 26px;
    width: 100%; max-width: 640px; max-height: 82vh; overflow-y: auto;
  }
  .modal-backdrop.center .modal-sheet { border-radius: var(--radius-lg); max-height: 90vh; }
  .modal-sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions > * { flex: 1; }

  #toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--card-soft); color: var(--text); padding: 11px 18px; border-radius: var(--radius-pill);
    font-size: 14px; font-weight: 600; z-index: 30; display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  #toast.error { background: var(--danger); color: var(--danger-ink); }

  /* Equipment / Muscles tag pickers */
  .tag-pill-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .tag-pill {
    display: inline-flex; align-items: center; padding: 7px 14px; border-radius: var(--radius-pill);
    background: var(--card-soft); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1.5px solid transparent; user-select: none;
  }
  .tag-pill.checked { background: var(--accent); color: var(--accent-ink); }
  .muscle-order-hint { font-size: 12px; color: var(--text-dim); margin: 10px 0 6px; }
  .muscle-order-list { display: flex; flex-direction: column; gap: 6px; }
  .muscle-order-row {
    display: flex; align-items: center; gap: 8px; background: var(--card-soft);
    border-radius: var(--radius-md); padding: 8px 10px;
  }
  .muscle-order-row.dragging { opacity: 0.5; }
  .muscle-order-row .drag-handle {
    cursor: grab; touch-action: none; font-size: 18px; color: var(--text-dim);
    padding: 6px; line-height: 1;
  }
  .muscle-order-row .muscle-order-label { flex: 1; font-size: 14px; }
  .muscle-order-row .muscle-order-label b { color: var(--accent); }

  /* Bodyweight +/- sign toggle in Log screen entry rows */
  .weight-with-sign { display: flex; align-items: center; justify-content: center; gap: 3px; }
  .weight-with-sign input.cell-num { min-width: 0; }
  .sign-toggle {
    flex-shrink: 0; width: 22px; height: 28px; border-radius: 8px; border: none;
    font-size: 15px; font-weight: 800; cursor: pointer; line-height: 1;
  }
  .sign-toggle.pos { background: var(--accent); color: var(--accent-ink); }
  .sign-toggle.neg { background: var(--danger); color: var(--danger-ink); }

  /* Account: avatar, drawer, edit-account modal */
  .avatar {
    border-radius: var(--radius-pill); background-color: var(--accent-soft); color: var(--text);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    background-size: cover; background-position: center; flex-shrink: 0; overflow: hidden;
  }
  .avatar-btn {
    width: 40px; height: 40px; font-size: 17px; border: none; cursor: pointer;
    border-radius: var(--radius-pill); background-color: var(--accent-soft); color: var(--text);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    background-size: cover; background-position: center;
  }
  .avatar-lg { width: 52px; height: 52px; font-size: 20px; }
  .avatar-xl { width: 84px; height: 84px; font-size: 30px; }

  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 22;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .drawer-panel {
    width: 100%; max-width: 640px; background: var(--card);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg); padding: 20px 18px;
    transform: translateY(-100%); transition: transform 0.22s ease;
  }
  .drawer-panel.open { transform: translateY(0); }
  .drawer-profile-row { display: flex; align-items: center; gap: 14px; }
  .drawer-profile-name { font-size: 17px; font-weight: 700; }
  .drawer-item {
    display: block; width: 100%; text-align: left; margin-top: 14px; padding: 14px;
    background: var(--card-soft); color: var(--text); border: none; border-radius: var(--radius-md);
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
</style>
</head>

<!-- ACCOUNT DRAWER -->
<div class="drawer-backdrop" id="accountDrawerBackdrop" style="display:none;">
  <div class="drawer-panel" id="accountDrawer">
    <div class="drawer-profile-row">
      <div class="avatar avatar-lg" id="drawerAvatar"></div>
      <div class="drawer-profile-name" id="drawerName">Your Name</div>
    </div>
    <button class="drawer-item" id="editAccountBtn">Edit Account</button>
  </div>
</div>

<main>

  <!-- LIBRARY SCREEN -->
  <section class="screen" id="screen-library">
    <h2>Exercise Library</h2>
    <div class="field">
      <input type="text" id="librarySearch" placeholder="Search exercises...">
    </div>
    <div class="field">
      <select id="libraryCategoryFilter">
        <option value="">All categories</option>
      </select>
    </div>
    <button class="btn secondary block" id="toggleAddExerciseBtn" style="margin-bottom:14px;">+ Add Exercise</button>

    <div class="card" id="addExerciseForm" style="display:none;">
      <div class="field">
        <label for="newExName">Name</label>
        <input type="text" id="newExName" placeholder="e.g. Barbell Squat">
      </div>
      <div class="field" id="newExCategoryField"></div>
      <div class="field" id="newExEquipmentField"></div>
      <div class="field" id="newExMusclesField"></div>
      <button class="btn block" id="submitNewExerciseBtn">Save Exercise</button>
    </div>

    <p class="muted" style="margin-bottom:6px;">Tap an exercise to edit it.</p>
    <div id="libraryList"></div>
  </section>

  <!-- LOG WORKOUT SCREEN -->
  <section class="screen" id="screen-log">
    <div id="logStartView">
      <h2>Log Workout</h2>
      <p class="muted">Start a new session to begin adding exercises and sets.</p>
      <button class="btn block" id="startWorkoutBtn">Log Workout</button>
    </div>

    <div id="logActiveView" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h2 id="logHeading">Log Workout</h2>
        <button class="btn-sm danger" id="discardWorkoutBtn">Discard</button>
      </div>

      <div class="field">
        <label for="sessionDateInput">Date</label>
        <input type="date" id="sessionDateInput">
      </div>

      <div id="linkBar" style="display:none; margin-bottom:12px;">
        <button class="btn secondary" id="linkSelectedBtn">Link as Superset</button>
        <button class="btn-sm" id="cancelSelectBtn" style="margin-left:8px;">Cancel</button>
      </div>

      <div id="sessionExerciseList"></div>

      <div class="field" style="margin-top:16px;">
        <label for="sessionExerciseSearch">Add an exercise</label>
        <input type="text" id="sessionExerciseSearch" placeholder="Search exercises to add...">
        <div class="search-results" id="sessionSearchResults"></div>
        <div id="quickAddForm" style="display:none; margin-top:8px;"></div>
      </div>

      <button class="btn block" id="saveWorkoutBtn" style="margin-top:8px;">Save Workout</button>
    </div>
  </section>

  <!-- HISTORY SCREEN -->
  <section class="screen" id="screen-history">
    <h2>History</h2>
    <div id="historyList"></div>
  </section>

</main>

<nav class="bottomnav">
  <button data-screen="library"><span class="nav-icon nav-icon-library"></span><span>Library</span></button>
  <button data-screen="log"><span class="nav-icon nav-icon-log"></span><span>Log</span></button>
  <button data-screen="history"><span class="nav-icon nav-icon-history"></span><span>History</span></button>
</nav>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var NEW_CATEGORY_VALUE = '__new__';

  // ---------- State ----------
  var API_URL = localStorage.getItem('workoutlog.apiUrl') || '';
  var exercisesCache = [];

  // Active in-progress (or being-edited) workout session.
  // items: [{localId, exerciseId, name, category, blockId}]
  // sets:  [{localId, itemLocalId, weight, reps}]  (order = insertion/chronological order)
  var session = null;
  var sessionMode = 'new'; // 'new' | 'edit'
  var selectMode = false;
  var selectedLocalIds = [];
  var entrySelection = {}; // blockId -> itemLocalId, sticky exercise choice for superset entry rows
  var entrySign = {}; // blockId -> 1 | -1, sticky +/- for Bodyweight entry rows (added weight vs. assisted)

  // ---------- Utilities ----------
  function $(id) { return document.getElementById(id); }
  function uid() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function showToast(msg, isError) {
    var t = $('toast');
    t.textContent = msg;
    t.className = isError ? 'error' : '';
    t.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.style.display = 'none'; }, 2600);
  }
  function distinctCategories() {
    return Array.from(new Set(exercisesCache.map(function (e) { return e.category; }).filter(Boolean))).sort();
  }

  function chipHtml(category) {
    return '<span class="chip">' + escapeHtml(category || 'Uncategorized') + '</span>';
  }

  // Simple edit-distance check to catch near-duplicate exercise names
  // (typos, or the same name with different capitalization).
  function levenshtein(a, b) {
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var dp = [];
    for (var i = 0; i <= m; i++) dp.push([i]);
    for (var j = 0; j <= n; j++) dp[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        var cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      }
    }
    return dp[m][n];
  }
  function findSimilarExercises(name, excludeId) {
    var a = name.trim().toLowerCase();
    return exercisesCache.filter(function (e) {
      if (excludeId && e.id === excludeId) return false;
      var b = e.name.trim().toLowerCase();
      return a === b || levenshtein(a, b) <= 2;
    });
  }
  // Runs saveFn() directly if no near-duplicates exist; otherwise shows a
  // warning with the close matches and lets the user Discard / Keep Editing / Save Anyway.
  function saveExerciseWithDupCheck(name, excludeId, saveFn, discardFn) {
    var matches = findSimilarExercises(name, excludeId);
    if (!matches.length) { saveFn(); return; }

    var listHtml = matches.map(function (m) {
      return '<div class="exercise-row" style="cursor:default;"><span class="name">' + escapeHtml(m.name) + '</span>' + chipHtml(m.category) + '</div>';
    }).join('');
    var body = '<p>"' + escapeHtml(name) + '" looks similar to what\'s already in your library:</p>' +
      '<div class="card" style="padding:2px 12px;">' + listHtml + '</div>' +
      '<div class="modal-actions">' +
        '<button class="btn secondary" id="dupDiscardBtn">Discard</button>' +
        '<button class="btn secondary" id="dupKeepBtn">Keep Editing</button>' +
      '</div>' +
      '<button class="btn block" id="dupSaveAnywayBtn" style="margin-top:10px;">Save Anyway</button>';
    var backdrop = showModal('This exercise may already exist', body, true);
    backdrop.querySelector('#dupDiscardBtn').addEventListener('click', function () {

    });
    backdrop.querySelector('#dupKeepBtn').addEventListener('click', function () { closeModal(backdrop); });
    backdrop.querySelector('#dupSaveAnywayBtn').addEventListener('click', function () {

      saveFn();
    });
  }

  // ---------- API ----------
  function apiGet(action, params) {
    if (!API_URL) return Promise.reject(new Error('No API URL configured. Open Settings.'));
    var url = API_URL + '?action=' + encodeURIComponent(action);
    for (var k in (params || {})) {
      url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }
    return fetch(url).then(function (r) { return r.json(); }).then(unwrap);
  }
  function apiPost(action, payload) {
    if (!API_URL) return Promise.reject(new Error('No API URL configured. Open Settings.'));
    var body = Object.assign({ action: action }, payload || {});
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(unwrap);
  }
  function unwrap(res) {
    if (!res || !res.ok) throw new Error((res && res.error) || 'Request failed');
    return res.data;
  }

  // Downscales an uploaded image client-side before storing it (keeps localStorage lean).
  function resizeImageFile(file, maxDim, callback) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- Generic single-select-with-"add new" widget ----------
  // Shared by Category and Equipment pickers (Add Exercise / Edit Exercise / Quick Add).
  function tagSelectHtml(idPrefix, fieldKey, options, selected, emptyLabel, labelText) {
    if (selected && options.indexOf(selected) === -1) options = options.concat([selected]);
    var opts = options.map(function (o) {
      return '<option value="' + escapeHtml(o) + '"' + (o === selected ? ' selected' : '') + '>' + escapeHtml(o) + '</option>';
    }).join('');
    return '<label for="' + idPrefix + '-' + fieldKey + '-select">' + escapeHtml(labelText) + '</label>' +

        '<option value="">' + escapeHtml(emptyLabel) + '</option>' +

        '<option value="' + NEW_CATEGORY_VALUE + '">+ Add New</option>' +
      '</select>' +
      '<input type="text" id="' + idPrefix + '-' + fieldKey + '-new" placeholder="New ' + escapeHtml(labelText.toLowerCase()) + '" style="display:none; margin-top:8px;">';
  }
  function wireTagSelect(idPrefix, fieldKey) {
    var sel = $(idPrefix + '-' + fieldKey + '-select');
    var newInput = $(idPrefix + '-' + fieldKey + '-new');
    sel.addEventListener('change', function () {
      newInput.style.display = sel.value === NEW_CATEGORY_VALUE ? 'block' : 'none';
      if (sel.value === NEW_CATEGORY_VALUE) newInput.focus();
    });
  }
  function readTagSelect(idPrefix, fieldKey) {
    var sel = $(idPrefix + '-' + fieldKey + '-select');
    if (sel.value === NEW_CATEGORY_VALUE) return $(idPrefix + '-' + fieldKey + '-new').value.trim();
    return sel.value;
  }

  function distinctEquipmentOptions() {
    var used = exercisesCache.map(function (e) { return e.equipment; }).filter(Boolean);
    return Array.from(new Set(BASE_EQUIPMENT.concat(used)));
  }
  function equipmentSelectHtml(idPrefix, selected) {

  // ---------- Muscles picker: multi-select chips + drag-to-reorder (top = primary) ----------
  var BASE_MUSCLES = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Forearms', 'Quads', 'Hamstrings', 'Glutes', 'Calves', 'Core', 'Lats', 'Traps'];
  function distinctMuscleOptions() {
    var used = [];
    exercisesCache.forEach(function (e) { (e.muscles || []).forEach(function (m) { used.push(m); }); });
    return Array.from(new Set(BASE_MUSCLES.concat(used)));
  }
  // Renders into #<idPrefix>-muscles-editor (container must already exist in the DOM).
  // Returns { getSelected() } so the caller can read the final ordered list on submit.
  function createMuscleEditor(idPrefix, initialMuscles) {
    var containerId = idPrefix + '-muscles-editor';
    var selected = (initialMuscles || []).slice();
    var extraOptions = [];

    function allOptions() {
      return Array.from(new Set(distinctMuscleOptions().concat(extraOptions).concat(selected)));
    }

    function wireDragReorder() {
      var listEl = $(idPrefix + '-muscle-order-list');
      if (!listEl) return;
      listEl.querySelectorAll('.drag-handle').forEach(function (handle) {
        handle.addEventListener('pointerdown', function (ev) {
          ev.preventDefault();
          var row = handle.closest('.muscle-order-row');
          row.classList.add('dragging');
          var moving = true;

          function rows() { return Array.from(listEl.querySelectorAll('.muscle-order-row')); }
          function onMove(moveEv) {
            if (!moving) return;
            var y = moveEv.clientY;
            var siblings = rows().filter(function (r) { return r !== row; });
            for (var i = 0; i < siblings.length; i++) {
              var rect = siblings[i].getBoundingClientRect();
              var mid = rect.top + rect.height / 2;
              if (y < mid) { listEl.insertBefore(row, siblings[i]); return; }
            }
            listEl.appendChild(row);
          }
          function onUp() {
            moving = false;
            row.classList.remove('dragging');
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
            selected = rows().map(function (r) { return r.dataset.muscle; });
            render();
          }
          document.addEventListener('pointermove', onMove);
          document.addEventListener('pointerup', onUp);
        });
      });
    }

    function render() {
      var container = $(containerId);
      if (!container) return;
      var chipsHtml = allOptions().map(function (m) {
        var checked = selected.indexOf(m) !== -1;
        return '<span class="tag-pill ' + (checked ? 'checked' : '') + '" data-muscle="' + escapeHtml(m) + '">' + escapeHtml(m) + '</span>';
      }).join('');
      var orderHtml = selected.length
        ? selected.map(function (m, idx) {
            return '<div class="muscle-order-row" data-muscle="' + escapeHtml(m) + '">' +
              '<span class="drag-handle">⠿</span>' +
              '<span class="muscle-order-label">' + (idx === 0 ? '<b>Primary:</b> ' : '') + escapeHtml(m) + '</span>' +
              '<button type="button" class="remove-x" data-remove-muscle="' + escapeHtml(m) + '">✕</button>' +
            '</div>';
          }).join('')
        : '<p class="muted" style="margin:4px 0;">No muscles selected.</p>';

      container.innerHTML =
        '<label>Muscles Worked</label>' +
        '<div class="tag-pill-grid">' + chipsHtml + '</div>' +
        '<div class="row" style="margin-top:8px;">' +
          '<input type="text" id="' + idPrefix + '-muscle-new" placeholder="Add new muscle">' +
          '<button type="button" class="btn-sm" id="' + idPrefix + '-muscle-add-btn" style="flex:0 0 auto;">Add</button>' +
        '</div>' +
        (selected.length > 1 ? '<div class="muscle-order-hint">Drag ⠿ to reorder — top is the primary muscle.</div>' : '') +
        '<div class="muscle-order-list" id="' + idPrefix + '-muscle-order-list">' + orderHtml + '</div>';

      container.querySelectorAll('.tag-pill').forEach(function (chip) {
        chip.addEventListener('click', function () {
          var m = chip.dataset.muscle;
          var idx = selected.indexOf(m);
          if (idx === -1) selected.push(m); else selected.splice(idx, 1);
          render();
        });
      });
      container.querySelectorAll('[data-remove-muscle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var m = btn.dataset.removeMuscle;
          selected = selected.filter(function (x) { return x !== m; });
          render();
        });
      });
      var addBtn = $(idPrefix + '-muscle-add-btn');
      if (addBtn) addBtn.addEventListener('click', function () {
        var input = $(idPrefix + '-muscle-new');
        var val = input.value.trim();
        if (!val) return;
        if (extraOptions.indexOf(val) === -1 && distinctMuscleOptions().indexOf(val) === -1) extraOptions.push(val);
        if (selected.indexOf(val) === -1) selected.push(val);
        render();
      });
      wireDragReorder();
    }

    render();
    return { getSelected: function () { return selected.slice(); } };
  }

    hideQuickAdd();
    renderSession();
    if (!exercisesCache.length) {
      apiGet('getExercises').then(function (data) { exercisesCache = data; }).catch(function () {});
    }
  }

  $('startWorkoutBtn').addEventListener('click', startNewSession);

  $('sessionDateInput').addEventListener('change', function () {
    if (session) session.date = this.value;
  });

  $('discardWorkoutBtn').addEventListener('click', function () {
    var msg = sessionMode === 'edit' ? 'Discard changes to this workout?' : 'Discard this workout? Nothing will be saved.';
    if (!confirm(msg)) return;
    var wasEdit = sessionMode === 'edit';
    session = null;
    $('logActiveView').style.display = 'none';
    $('logStartView').style.display = 'block';
    if (wasEdit) showScreen('history'); else showScreen('log');
  });

  $('sessionExerciseSearch').addEventListener('input', function () {
    var rawQuery = this.value.trim();
    var q = rawQuery.toLowerCase();
    var box = $('sessionSearchResults');
    hideQuickAdd();
    if (!q) { box.innerHTML = ''; return; }
    var matches = exercisesCache.filter(function (e) { return e.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 20);
    var matchesHtml = matches.length
      ? matches.map(function (e) {
          return '<div class="exercise-row" data-id="' + escapeHtml(e.id) + '">' +
            '<span class="name">' + escapeHtml(e.name) + '</span>' + chipHtml(e.category) + '</div>';
        }).join('')
      : '<div class="muted" style="padding:8px 0;">No matches</div>';
    var quickAddHtml = '<div class="exercise-row" id="quickAddTrigger" style="color:var(--accent);">' +
      '<span class="name">+ Add "' + escapeHtml(rawQuery) + '" as new exercise</span></div>';
    box.innerHTML = matchesHtml + quickAddHtml;
    box.querySelectorAll('.exercise-row[data-id]').forEach(function (row) {
      row.addEventListener('click', function () {
        addExerciseToSession(row.dataset.id);
        $('sessionExerciseSearch').value = '';
        box.innerHTML = '';
      });
    });
    box.querySelector('#quickAddTrigger').addEventListener('click', function () {
      showQuickAddForm(rawQuery);
    });
  });

  function showQuickAddForm(name) {
    var el = $('quickAddForm');
    el.style.display = 'block';
    el.innerHTML = '<div class="card">' +
      '<div class="field"><label for="quickAddName">Name</label>' +
      '<input type="text" id="quickAddName" value="' + escapeHtml(name) + '"></div>' +
      '<div class="field" id="quickAddCategoryField">' + categorySelectHtml('quickAdd', '') + '</div>' +
      '<div class="field" id="quickAddEquipmentField">' + equipmentSelectHtml('quickAdd', '') + '</div>' +
      '<p class="muted" style="margin:0 0 8px;">Add muscles worked later from the Library.</p>' +
      '<div class="modal-actions">' +
        '<button class="btn secondary" id="quickAddCancelBtn">Cancel</button>' +
        '<button class="btn" id="quickAddSaveBtn">Add &amp; Insert</button>' +
      '</div>' +
    '</div>';
    wireCategorySelect('quickAdd');
    wireEquipmentSelect('quickAdd');
    $('quickAddCancelBtn').addEventListener('click', hideQuickAdd);
    $('quickAddSaveBtn').addEventListener('click', function () {
      var nm = $('quickAddName').value.trim();
      var cat = readCategorySelect('quickAdd');
      var equip = readEquipmentSelect('quickAdd');
      if (!nm) { showToast('Name is required', true); return; }

      function doSave() {
        apiPost('addExercise', { name: nm, category: cat, equipment: equip }).then(function (newEx) {
          exercisesCache.push(newEx);
          addExerciseToSession(newEx.id);
          hideQuickAdd();
          $('sessionExerciseSearch').value = '';
          $('sessionSearchResults').innerHTML = '';
          showToast('Exercise added to library and workout');
        }).catch(function (err) { showToast(err.message, true); });
      }

      saveExerciseWithDupCheck(nm, null, doSave, null);
    });
  }

  function hideQuickAdd() {
    var el = $('quickAddForm');
    el.style.display = 'none';
    el.innerHTML = '';
  }

  function addExerciseToSession(exerciseId) {
    var ex = exercisesCache.find(function (e) { return e.id === exerciseId; });
    if (!ex) return;
    session.items.push({
      localId: uid(),
      exerciseId: ex.id,
      name: ex.name,
      category: ex.category,
      equipment: ex.equipment || '',
      blockId: uid()
    });
    renderSession();
  }

  function removeExerciseFromSession(localId) {
    session.items = session.items.filter(function (i) { return i.localId !== localId; });
    session.sets = session.sets.filter(function (s) { return s.itemLocalId !== localId; });
    selectedLocalIds = selectedLocalIds.filter(function (id) { return id !== localId; });
    renderSession();
  }

  function toggleSelect(localId) {
    var idx = selectedLocalIds.indexOf(localId);
    if (idx === -1) selectedLocalIds.push(localId); else selectedLocalIds.splice(idx, 1);
    selectMode = selectedLocalIds.length > 0;
    renderSession();
  }

  $('linkSelectedBtn').addEventListener('click', function () {
    if (selectedLocalIds.length < 2) { showToast('Select at least 2 exercises', true); return; }
    var newBlockId = uid();
    session.items.forEach(function (item) {
      if (selectedLocalIds.indexOf(item.localId) !== -1) item.blockId = newBlockId;
    });
    selectedLocalIds = [];
    selectMode = false;
    renderSession();
    showToast('Linked as superset');
  });

  $('cancelSelectBtn').addEventListener('click', function () {
    selectedLocalIds = [];
    selectMode = false;
    renderSession();
  });

  function groupByBlock(items) {
    var order = [];
    var map = {};
    items.forEach(function (item) {
      if (!map[item.blockId]) { map[item.blockId] = []; order.push(item.blockId); }
      map[item.blockId].push(item);
    });
    return order.map(function (blockId) { return { blockId: blockId, items: map[blockId] }; });
  }

  function renderSession() {
    var el = $('sessionExerciseList');
    $('linkBar').style.display = selectMode ? 'block' : 'none';

    if (!session.items.length) {
      el.innerHTML = '<div class="empty-state">Search above to add exercises to this workout.</div>';
      return;
    }

    var blocks = groupByBlock(session.items);
    el.innerHTML = blocks.map(function (block) {
      var isSuperset = block.items.length > 1;
      var inner = renderBlockTable(block);
      if (isSuperset) {
        return '<div class="superset-block"><div class="superset-label">🔗 Superset</div>' + inner + '</div>';
      }
      return '<div class="block-card">' + inner + '</div>';
    }).join('');

    el.querySelectorAll('[data-action]').forEach(function (node) {
      node.addEventListener('click', function () {
        var action = node.dataset.action;
        var localId = node.dataset.local;
        if (action === 'select') toggleSelect(localId);
        else if (action === 'remove') removeExerciseFromSession(localId);
        else if (action === 'addset') addSet(node.dataset.block);
        else if (action === 'delset') deleteSet(node.dataset.setid);
        else if (action === 'togglesign') toggleEntrySign(node.dataset.block);
      });
    });
    el.querySelectorAll('select.cell-exercise-select').forEach(function (sel) {
      sel.addEventListener('change', function () {
        entrySelection[sel.dataset.block] = sel.value;
        renderSession(); // selected exercise may differ in Bodyweight-ness -> re-check sign toggle visibility
      });
    });
    el.querySelectorAll('input.cell-num').forEach(function (input) {
      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); addSet(input.dataset.block); }
      });
    });
  }

  function renderBlockTable(block) {
    var isSuperset = block.items.length > 1;
    var checkboxes = block.items.map(function (item) {
      var checked = selectedLocalIds.indexOf(item.localId) !== -1;
      return '<span class="select-check ' + (checked ? 'checked' : '') + '" data-action="select" data-local="' + item.localId + '">' + (checked ? '✓' : '') + '</span>' +
        '<span class="name">' + escapeHtml(item.name) + '</span>' +
        (isSuperset ? '' : chipHtml(item.category)) +
        '<button class="remove-x" data-action="remove" data-local="' + item.localId + '">✕</button>';
    }).join('<span class="muted" style="margin:0 4px;">+</span>');

    var rows = session.sets.filter(function (s) {
      return block.items.some(function (i) { return i.localId === s.itemLocalId; });
    });

    var rowsHtml = rows.map(function (s) {
      var item = block.items.find(function (i) { return i.localId === s.itemLocalId; }) || {};
      var weightLabel = item.equipment === 'Bodyweight' && s.weight > 0 ? '+' + s.weight : String(s.weight);
      return '<div class="set-table-row">' +
        '<span class="cell-exercise">' + escapeHtml(item.name || '') + '</span>' +
        '<span class="cell-exercise" style="text-align:center;">' + escapeHtml(weightLabel) + '</span>' +
        '<span class="cell-exercise" style="text-align:center;">' + escapeHtml(s.reps) + '</span>' +
        '<button class="del" data-action="delset" data-setid="' + s.localId + '">✕</button>' +
      '</div>';
    }).join('');

    var defaultItem = entrySelection[block.blockId] && block.items.some(function (i) { return i.localId === entrySelection[block.blockId]; })
      ? entrySelection[block.blockId] : block.items[0].localId;
    entrySelection[block.blockId] = defaultItem;

    var exerciseCell = isSuperset
      ? '<select class="cell-exercise-select" data-block="' + block.blockId + '">' +
          block.items.map(function (i) {
            return '<option value="' + i.localId + '"' + (i.localId === defaultItem ? ' selected' : '') + '>' + escapeHtml(i.name) + '</option>';
          }).join('') +
        '</select>'
      : '<span class="cell-exercise">' + escapeHtml(block.items[0].name) + '</span>';

    var selectedItem = block.items.find(function (i) { return i.localId === defaultItem; }) || block.items[0];
    var isBodyweightEntry = selectedItem.equipment === 'Bodyweight';
    if (isBodyweightEntry && entrySign[block.blockId] == null) entrySign[block.blockId] = 1;
    var signIsNeg = isBodyweightEntry && entrySign[block.blockId] === -1;
    var weightCell = isBodyweightEntry
      ? '<span class="weight-with-sign">' +
          '<button type="button" class="sign-toggle ' + (signIsNeg ? 'neg' : 'pos') + '" data-action="togglesign" data-block="' + block.blockId + '" title="' + (signIsNeg ? 'Assisted (subtract)' : 'Added weight') + '">' + (signIsNeg ? '−' : '+') + '</button>' +
          '<input type="number" inputmode="decimal" class="cell-num" placeholder="lbs" id="w-' + block.blockId + '" data-block="' + block.blockId + '">' +
        '</span>'
      : '<input type="number" inputmode="decimal" class="cell-num" placeholder="lbs" id="w-' + block.blockId + '" data-block="' + block.blockId + '">';

    var entryRow = '<div class="set-table-row">' +
      exerciseCell +
      weightCell +
      '<input type="number" inputmode="numeric" class="cell-num" placeholder="reps" id="r-' + block.blockId + '" data-block="' + block.blockId + '">' +
      '<button class="add-btn" data-action="addset" data-block="' + block.blockId + '">+</button>' +
    '</div>';

    return '<div class="block-card-head"><div class="titles">' + checkboxes + '</div></div>' +
      '<div class="set-table">' +
        '<div class="set-table-row head"><span>Exercise</span><span>Weight (lbs)</span><span>Reps</span><span></span></div>' +
        rowsHtml +
        entryRow +
      '</div>';
  }

  function toggleEntrySign(blockId) {
    entrySign[blockId] = entrySign[blockId] === -1 ? 1 : -1;
    renderSession();
    var newW = $('w-' + blockId);
    if (newW) newW.focus();
  }

  function addSet(blockId) {
    var wEl = $('w-' + blockId), rEl = $('r-' + blockId);
    var magnitude = parseFloat(wEl.value), reps = parseInt(rEl.value, 10);
    if (isNaN(magnitude) || isNaN(reps)) { showToast('Enter weight and reps', true); return; }
    var itemLocalId = entrySelection[blockId];
    var item = session.items.find(function (i) { return i.localId === itemLocalId; });
    var weight = magnitude;
    if (item && item.equipment === 'Bodyweight') {
      weight = Math.abs(magnitude) * (entrySign[blockId] === -1 ? -1 : 1);
    }
    session.sets.push({ localId: uid(), itemLocalId: itemLocalId, weight: weight, reps: reps });
    renderSession();
    var newW = $('w-' + blockId);
    if (newW) newW.focus();
  }

  function deleteSet(setLocalId) {
    session.sets = session.sets.filter(function (s) { return s.localId !== setLocalId; });
    renderSession();
  }

  function loadWorkoutIntoSession(workout) {
    session = { id: workout.id, date: workout.date, items: [], sets: [] };
    sessionMode = 'edit';
    selectMode = false;
    selectedLocalIds = [];
    entrySelection = {};
    entrySign = {};

    var itemKeyMap = {};
    workout.sets.forEach(function (s) {
      var key = s.blockId + '|' + s.exerciseId;
      if (!itemKeyMap[key]) {
        var localId = uid();
        itemKeyMap[key] = localId;
        session.items.push({ localId: localId, exerciseId: s.exerciseId, name: s.exerciseName, category: s.exerciseCategory, equipment: s.exerciseEquipment || '', blockId: s.blockId });
      }
      session.sets.push({ localId: uid(), itemLocalId: itemKeyMap[key], weight: s.weight, reps: s.reps });
    });

    $('logHeading').textContent = 'Edit Workout';
    $('saveWorkoutBtn').textContent = 'Save Changes';
    $('logStartView').style.display = 'none';
    $('logActiveView').style.display = 'block';
    $('sessionDateInput').value = session.date;
    $('sessionExerciseSearch').value = '';
    $('sessionSearchResults').innerHTML = '';
    hideQuickAdd();
    renderSession();
    if (!exercisesCache.length) {
      apiGet('getExercises').then(function (data) { exercisesCache = data; }).catch(function () {});
    }
    showScreen('log');
  }

  $('saveWorkoutBtn').addEventListener('click', function () {
    if (!session || !session.items.length) { showToast('Add at least one exercise', true); return; }
    if (!session.date) { showToast('Pick a date', true); return; }
    if (!session.sets.length) { showToast('Log at least one set', true); return; }

    // Build payload per item (not per block) since a superset block can hold
    // sets for multiple different exerciseIds sharing the same blockId.
    var payloadItems = session.items.map(function (item) {
      return {
        exerciseId: item.exerciseId,
        blockId: item.blockId,
        sets: session.sets.filter(function (s) { return s.itemLocalId === item.localId; })
          .map(function (s) { return { weight: s.weight, reps: s.reps }; })
      };
    }).filter(function (i) { return i.sets.length > 0; });

    var action = sessionMode === 'edit' ? 'updateWorkout' : 'saveWorkout';
    var payload = sessionMode === 'edit'
      ? { id: session.id, date: session.date, items: payloadItems }
      : { date: session.date, items: payloadItems };

    $('saveWorkoutBtn').disabled = true;
    apiPost(action, payload).then(function () {
      showToast(sessionMode === 'edit' ? 'Workout updated' : 'Workout saved');
      session = null;
      $('logActiveView').style.display = 'none';
      $('logStartView').style.display = 'block';
      showScreen('history');
    }).catch(function (err) {
      showToast(err.message, true);
    }).finally(function () {
      $('saveWorkoutBtn').disabled = false;
    });
  });

  // ---------- History ----------
  function loadHistory() {
    var el = $('historyList');
    el.innerHTML = '<div class="muted">Loading...</div>';
    apiGet('getWorkouts').then(function (data) {
      if (!data.length) {
        el.innerHTML = '<div class="empty-state">No workouts logged yet.</div>';
        return;
      }
      el.innerHTML = data.map(function (w) {
        return '<div class="card" data-id="' + escapeHtml(w.id) + '" style="cursor:pointer;">' +
          '<div class="name" style="font-weight:700; margin-bottom:4px;">' + escapeHtml(w.date) + '</div>' +
          '<div class="muted">' + w.exerciseCount + ' exercise' + (w.exerciseCount === 1 ? '' : 's') +
          ' · ' + w.setCount + ' set' + (w.setCount === 1 ? '' : 's') + '</div>' +
        '</div>';
      }).join('');
      el.querySelectorAll('[data-id]').forEach(function (card) {
        card.addEventListener('click', function () { openWorkoutDetail(card.dataset.id); });
      });
    }).catch(function (err) {
      el.innerHTML = '<div class="empty-state">Failed to load: ' + escapeHtml(err.message) + '</div>';
    });
  }

  function openWorkoutDetail(id) {
    apiGet('getWorkout', { id: id }).then(function (w) {
      var blocks = groupSetsByBlock(w.sets);
      var body = blocks.map(function (block) {
        var isSuperset = block.exerciseGroups.length > 1;
        var inner = block.exerciseGroups.map(function (g) {
          var isBw = g.exerciseEquipment === 'Bodyweight';
          var setsHtml = g.sets.map(function (s, idx) {
            var weightLabel = isBw && s.weight > 0 ? '+' + s.weight : String(s.weight);
            return '<div class="set-table-row"><span>Set ' + (idx + 1) + '</span><span>' + escapeHtml(weightLabel) + ' lbs</span><span>' + escapeHtml(s.reps) + ' reps</span><span></span></div>';
          }).join('');
          return '<div class="block-card"><div class="name">' + escapeHtml(g.exerciseName) +
            '</div>' + chipHtml(g.exerciseCategory) +
            '<div class="set-table">' + setsHtml + '</div></div>';
        }).join('');
        if (isSuperset) return '<div class="superset-block"><div class="superset-label">🔗 Superset</div>' + inner + '</div>';
        return inner;
      }).join('') || '<div class="empty-state">No sets recorded.</div>';

      body += '<div class="modal-actions">' +
        '<button class="btn secondary" id="detailEditBtn">Edit</button>' +
        '<button class="btn danger" id="detailDeleteBtn">Delete</button>' +
      '</div>';

      var backdrop = showModal('Workout — ' + w.date, body);
      backdrop.querySelector('#detailEditBtn').addEventListener('click', function () {
        closeModal(backdrop);
        loadWorkoutIntoSession(w);
      });
      backdrop.querySelector('#detailDeleteBtn').addEventListener('click', function () {
        closeModal(backdrop);
        confirmDeleteWorkout(w.id);
      });
    }).catch(function (err) { showToast(err.message, true); });
  }

  function confirmDeleteWorkout(id) {
    var body = '<p>Are you sure you want to erase this workout?</p>' +
      '<div class="modal-actions">' +
        '<button class="btn secondary" id="confirmNoBtn">No</button>' +
        '<button class="btn danger" id="confirmDeleteBtn">Delete</button>' +
      '</div>';
    var backdrop = showModal('Delete Workout', body, true);
    backdrop.querySelector('#confirmNoBtn').addEventListener('click', function () { closeModal(backdrop); });
    backdrop.querySelector('#confirmDeleteBtn').addEventListener('click', function () {
      apiPost('deleteWorkout', { id: id }).then(function () {
        closeModal(backdrop);
        showToast('Workout deleted');
        loadHistory();
      }).catch(function (err) { showToast(err.message, true); });
    });
  }

  function groupSetsByBlock(sets) {
    var blockOrder = [], blockMap = {};
    sets.forEach(function (s) {
      if (!blockMap[s.blockId]) { blockMap[s.blockId] = { blockId: s.blockId, exOrder: [], exMap: {} }; blockOrder.push(s.blockId); }
      var b = blockMap[s.blockId];
      if (!b.exMap[s.exerciseId]) {
        b.exMap[s.exerciseId] = { exerciseName: s.exerciseName, exerciseCategory: s.exerciseCategory, exerciseEquipment: s.exerciseEquipment, sets: [] };
        b.exOrder.push(s.exerciseId);
      }
      b.exMap[s.exerciseId].sets.push({ weight: s.weight, reps: s.reps });
    });
    return blockOrder.map(function (blockId) {
      var b = blockMap[blockId];
      return { blockId: blockId, exerciseGroups: b.exOrder.map(function (exId) { return b.exMap[exId]; }) };
    });
  }

  // ---------- Modal helpers ----------
  function showModal(title, bodyHtml, centered) {
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop' + (centered ? ' center' : '');
    backdrop.innerHTML = '<div class="modal-sheet">' +
      '<div class="modal-sheet-head"><h3>' + escapeHtml(title) + '</h3><button class="icon-btn" id="closeModalBtn">Close</button></div>' +
      bodyHtml + '</div>';
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeModal(backdrop); });
    backdrop.querySelector('#closeModalBtn').addEventListener('click', function () { closeModal(backdrop); });
    return backdrop;
  }
  function closeModal(backdrop) {
    if (backdrop && backdrop.dataset.locked === '1') return; // e.g. first-run account setup: must Save to proceed
    if (backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
  }

  // ---------- Init ----------
  function init() {
    showScreen('library');
    if (!API_URL) openEditAccountModal(true);
  }

  init();
})();
</script>

</body>
</html>
